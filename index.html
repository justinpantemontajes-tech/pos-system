const ExpensesPage=({user})=>{
const [expenses,setExpenses]=useState(()=>DB.get('expenses',[]));
const [showModal,setShowModal]=useState(false);
const [dateFilter,setDateFilter]=useState(today());
const [form,setForm]=useState({amount:'',category:'',notes:'',receivedBy:''});
const [confirm,setConfirm]=useState(null);
const expCats=['Supplies','Utilities','Salary/Wages','Maintenance','Food/Snacks','Transport','Miscellaneous'];

const add=useCallback(function(){
if(!form.amount||!form.category){showToast('Amount and category required','error');return;}
try {
var exp={id:uid(),...form,amount:Number(form.amount),encodedBy:user.name,date:today(),createdAt:now(),sync_status:'pending'};
var updated=[...expenses,exp];DB.set('expenses',updated);setExpenses(updated);
DB.setAsync('expenses',updated).catch(function(e){ console.warn('IDB sync failed:',e); });
setForm({amount:'',category:'',notes:'',receivedBy:''});setShowModal(false);
showToast('Expense recorded','success');
if(!navigator.onLine){ DB.queueOffline('expense', exp); }
DB.createBackup();
} catch (e) { showToast('Failed to record expense','error'); }
},[form,user,expenses]);

const del=useCallback((id)=>{
try { const updated=expenses.filter(e=>e.id!==id);DB.set('expenses',updated);setExpenses(updated); }
catch (e) { showToast('Delete failed','error'); }
},[expenses]);

const filtered=[...expenses].filter(e=>e.date===dateFilter).reverse();
const total=filtered.reduce((s,e)=>s+e.amount,0);

return(
<div style={{padding:'20px',flex:1,overflow:'auto'}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<div><h2 style={{fontSize:20,fontWeight:700}}>Expenses</h2></div>
<div style={{display:'flex',gap:10,alignItems:'center'}}>
<input type="date" value={dateFilter} onChange={e=>setDateFilter(e.target.value)} style={{width:160}}/>
<button className="btn btn-primary btn-sm" onClick={()=>setShowModal(true)}>+ Add Expense</button>
</div>
</div>
<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,marginBottom:20}}>
<div className="stat-card"><div className="stat-val" style={{color:'var(--red)'}}>{fmtCur(total)}</div><div className="stat-label">Total Expenses Today</div></div>
<div className="stat-card"><div className="stat-val">{filtered.length}</div><div className="stat-label">Records</div></div>
<div className="stat-card"><div className="stat-val" style={{color:'var(--text2)',fontSize:14}}>
{filtered.length>0?filtered.sort((a,b)=>b.amount-a.amount)[0].category:'—'}
</div><div className="stat-label">Top Category</div></div>
</div>
<div className="card" style={{padding:0,overflow:'hidden'}}>
<table>
<thead><tr><th>Time</th><th>Category</th><th>Amount</th><th>Notes</th><th>Received By</th><th>Encoded By</th><th>Actions</th></tr></thead>
<tbody>
{filtered.map(e=>(
<tr key={e.id}>
<td style={{fontSize:12}}>{fmtTime(e.createdAt)}</td>
<td><span className="tag">{e.category}</span></td>
<td style={{fontFamily:'var(--mono)',fontWeight:600,color:'var(--red)'}}>{fmtCur(e.amount)}</td>
<td style={{fontSize:12,color:'var(--text2)'}}>{e.notes||'—'}</td>
<td style={{fontSize:12}}>{e.receivedBy||'—'}</td>
<td style={{fontSize:12}}>{e.encodedBy}</td>
<td>{user.role==='admin'&&<button className="btn btn-ghost btn-sm" style={{color:'var(--red)',padding:'4px 8px'}} onClick={()=>setConfirm({msg:'Delete this expense?',cb:()=>del(e.id)})}>{Icon.trash}</button>}</td>
</tr>
))}
{filtered.length===0&&<tr><td colSpan={7} style={{textAlign:'center',padding:'30px',color:'var(--text3)'}}>No expenses for this date</td></tr>}
</tbody>
</table>
</div>

{showModal&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:420}}>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}>
<h3>Add Expense</h3>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowModal(false)}>✕</button>
</div>
<div className="form-row"><label>Amount (₱) *</label><input type="number" value={form.amount} onChange={e=>setForm(p=>({...p,amount:e.target.value}))} style={{width:'100%',fontSize:16}}/></div>
<div className="form-row"><label>Category *</label>
<select value={form.category} onChange={e=>setForm(p=>({...p,category:e.target.value}))} style={{width:'100%'}}>

<div className="form-row"><label>Notes / Description</label><textarea value={form.notes} onChange={e=>setForm(p=>({...p,notes:e.target.value}))} style={{width:'100%',height:70,resize:'vertical'}} placeholder="Optional details..."/></div>
<div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
<button className="btn btn-ghost" onClick={()=>setShowModal(false)}>Cancel</button>
<button className="btn btn-danger" onClick={add}>Record Expense</button>

{confirm&&<ConfirmModal msg={confirm.msg} onYes={()=>{confirm.cb();setConfirm(null);}} onNo={()=>setConfirm(null)}/>}

const ReportsPage=()=>{
const [range,setRange]=useState('daily');
const [dateFrom,setDateFrom]=useState(today());
const [dateTo,setDateTo]=useState(today());
const salesChartRef=useRef(null);
const expChartRef=useRef(null);
const chartInst=useRef([]);

const getRange=useCallback(()=>{
const txns=DB.get('transactions',[]);
const exps=DB.get('expenses',[]);
let from,to;
if(range==='daily'){from=dateTo;to=dateTo;}
else if(range==='weekly'){const d=new Date();d.setDate(d.getDate()-6);from=d.toISOString().slice(0,10);to=today();}
else if(range==='monthly'){from=today().slice(0,7)+'-01';to=today();}
else{from=today().slice(0,4)+'-01-01';to=today();}
const ft=txns.filter(t=>t.date>=from&&t.date<=to);
const fe=exps.filter(e=>e.date>=from&&e.date<=to);
return{txns:ft,exps:fe,from,to};
},[range,dateFrom,dateTo]);

const {txns,exps,from,to}=getRange();
const totalSales=txns.reduce((s,t)=>s+t.total,0);
const totalExp=exps.reduce((s,e)=>s+e.amount,0);
const netProfit=totalSales-totalExp;
const totalTransactions=txns.length;

const productSales={};
txns.forEach(t=>t.items.forEach(i=>{
if(!productSales[i.id])productSales[i.id]={name:i.name,qty:0,revenue:0};
productSales[i.id].qty+=i.qty;productSales[i.id].revenue+=i.subtotal;
}));
const topProducts=Object.values(productSales).sort((a,b)=>b.revenue-a.revenue).slice(0,8);

const dayMap={}; txns.forEach(t=>{dayMap[t.date]=(dayMap[t.date]||0)+t.total;});
const expDayMap={}; exps.forEach(e=>{expDayMap[e.date]=(expDayMap[e.date]||0)+e.amount;});
const allDates=[...new Set([...Object.keys(dayMap),...Object.keys(expDayMap)])].sort();

useEffect(function(){
chartInst.current.forEach(function(c){ try { c.destroy(); } catch(e) {} });
chartInst.current=[];
if(salesChartRef.current&&allDates.length>0){
const ctx=salesChartRef.current.getContext('2d');
const inst=new Chart(ctx,{
type:'bar',
data:{
labels:allDates.map(d=>new Date(d).toLocaleDateString('en-PH',{month:'short',day:'numeric'})),
datasets:[
{label:'Sales',data:allDates.map(d=>dayMap[d]||0),backgroundColor:'rgba(79,142,247,0.7)',borderRadius:5},
{label:'Expenses',data:allDates.map(d=>expDayMap[d]||0),backgroundColor:'rgba(240,80,80,0.7)',borderRadius:5},
]
},
options:{responsive:true,plugins:{legend:{labels:{color:'#9aa3be',font:{family:'Sora'}}}},scales:{x:{ticks:{color:'#5a6380'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#5a6380',callback:v=>'₱'+v.toLocaleString()},grid:{color:'rgba(255,255,255,0.06)'}}}}
});
chartInst.current.push(inst);
}
if(expChartRef.current&&topProducts.length>0){
const ctx=expChartRef.current.getContext('2d');
const inst=new Chart(ctx,{
type:'bar',
data:{
labels:topProducts.map(p=>p.name.length>18?p.name.slice(0,18)+'…':p.name),
datasets:[{label:'Revenue',data:topProducts.map(p=>p.revenue),backgroundColor:'rgba(34,200,122,0.7)',borderRadius:5}]
},
options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#5a6380',callback:v=>'₱'+v.toLocaleString()},grid:{color:'rgba(255,255,255,0.06)'}},y:{ticks:{color:'#9aa3be',font:{size:11}}}}}
});
chartInst.current.push(inst);
}
return()=>{chartInst.current.forEach(c=>c.destroy());chartInst.current=[];};
},[range,dateFrom,dateTo,txns.length]);

const saveReport = useCallback(async () => {
  try {
    const reportData = {
      id: 'RPT_' + uid(),
      type: range,
      date_from: from,
      date_to: to,
      total_sales: totalSales,
      total_expenses: totalExp,
      net_profit: netProfit,
      total_transactions: totalTransactions,
      created_at: now(),
      sync_status: 'pending'
    };
    // Save to archives (this is what AdminArchivePage reads)
    const archives = DB.get('archives', []);
    archives.push(reportData);
    DB.set('archives', archives);
    DB.setAsync('archives', archives).catch(function(e){ console.warn('IDB sync failed:',e); });
    // Also save to reports for backward compatibility
    const reports = DB.get('reports', []);
    reports.push(reportData);
    DB.set('reports', reports);
    DB.setAsync('reports', reports).catch(function(e){ console.warn('IDB sync failed:',e); });
    if (navigator.onLine && supabaseClient) {
      DB.queueOffline('archive', reportData);
    }
    showToast('Report saved to Archive', 'success');
  } catch (e) {
    showToast('Failed to save report', 'error');
  }
}, [range, from, to, totalSales, totalExp, netProfit, totalTransactions]);

const exportCSV=useCallback(()=>{
try {
const rows=[['Date','TXN#','Customer','Total','Payment','Cashier'],...txns.map(t=>[t.date,t.id,t.customerName,t.total,t.payMode,t.cashierName])];
const csv=rows.map(r=>r.join(',')).join('\n');
const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
a.download='sales_report.csv';a.click();
} catch (e) { showToast('Export failed','error'); }
},[txns]);

return(
<div style={{padding:'20px',flex:1,overflow:'auto'}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<div><h2 style={{fontSize:20,fontWeight:700}}>Reports & Analytics</h2></div>

</div>
<div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
<div className="stat-card"><div className="stat-val" style={{color:'var(--accent)'}}>{fmtCur(totalSales)}</div><div className="stat-label">Total Sales</div></div>
<div className="stat-card"><div className="stat-val" style={{color:'var(--red)'}}>{fmtCur(totalExp)}</div><div className="stat-label">Total Expenses</div></div>

<div className="stat-card"><div className="stat-val">{totalTransactions}</div><div className="stat-label">Transactions</div></div>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
<div className="card">
<div style={{fontWeight:600,marginBottom:12}}>Sales vs Expenses</div>
{allDates.length>0?<canvas ref={salesChartRef} height={180}/>:<div style={{textAlign:'center',padding:'40px',color:'var(--text3)',fontSize:13}}>No data for this period</div>}
</div>
<div className="card">
<div style={{fontWeight:600,marginBottom:12}}>Best-Selling Products</div>
{topProducts.length>0?<canvas ref={expChartRef} height={180}/>:<div style={{textAlign:'center',padding:'40px',color:'var(--text3)',fontSize:13}}>No sales data</div>}
</div>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
<div className="card">
<div style={{fontWeight:600,marginBottom:12}}>Top Products by Revenue</div>
<table>
<thead><tr><th>#</th><th>Product</th><th>Qty Sold</th><th>Revenue</th></tr></thead>
<tbody>{topProducts.slice(0,6).map((p,i)=>(
<tr key={i}>
<td style={{color:'var(--text3)',fontFamily:'var(--mono)'}}>{i+1}</td>
<td style={{fontSize:13}}>{p.name}</td>
<td style={{fontFamily:'var(--mono)'}}>{p.qty}</td>
<td style={{fontFamily:'var(--mono)',color:'var(--green)'}}>{fmtCur(p.revenue)}</td>
</tr>
))}</tbody>
</table>
</div>
<div className="card">
<div style={{fontWeight:600,marginBottom:12}}>Shift Reports</div>
<table>
<thead><tr><th>Date</th><th>Cashier</th><th>Sales</th><th>Cash</th><th>Status</th></tr></thead>
<tbody>{[...DB.get('shifts',[])].reverse().slice(0,8).map(s=>{
const shiftId = s.shiftId || s.id || uid();
return (
<tr key={shiftId}>
<td style={{fontSize:11}}>{s.date}</td>
<td style={{fontSize:12}}>{s.cashierName}</td>
<td style={{fontFamily:'var(--mono)',fontSize:12}}>{fmtCur(s.totalSales)}</td>
<td style={{fontFamily:'var(--mono)',fontSize:12}}>{fmtCur(s.cashOnHand)}</td>
<td><span className={`badge ${s.status==='over'?'badge-green':s.status==='short'?'badge-red':'badge-blue'}`}>{(s.status||'exact').toUpperCase()}</span></td>
</tr>
);
})}</tbody>
</table>
</div>
</div>
</div>
);
};

const AdminArchivePage=()=>{
const [archive,setArchive]=useState(()=>DB.get('archives',[]));
const [searchDate,setSearchDate]=useState('');
const [searchType,setSearchType]=useState('');
const [confirm,setConfirm]=useState(null);
const [refreshTick,setRefreshTick]=useState(0);

useEffect(function(){
var data = DB.get('archives',[]);
setArchive(data);
},[refreshTick]);

const filtered = useMemo(()=>{
let data = [...archive].reverse();
if(searchDate) data = data.filter(s=>s.date === searchDate || (s.date_from && s.date_from <= searchDate && s.date_to >= searchDate));
if(searchType) data = data.filter(s=>s.type === searchType);
return data;
},[archive,searchDate,searchType]);

const deleteArchive = useCallback((id) => {
  try {
    const updated = archive.filter(a => a.id !== id);
    DB.set('archives', updated);
    setArchive(updated);
    showToast('Archive deleted', 'success');
  } catch (e) {
    showToast('Delete failed', 'error');
  }
}, [archive]);

return(

{filtered.map(s=>{

<td><span className="badge badge-blue">{s.type}</span></td>
<td style={{fontSize:12}}>{s.date || (s.date_from + ' to ' + s.date_to)}</td>
<td style={{fontFamily:'var(--mono)',fontWeight:600,color:'var(--accent)'}}>{fmtCur(s.total_sales)}</td>
<td style={{fontFamily:'var(--mono)',color:s.net_profit>=0?'var(--green)':'var(--red)'}}>{fmtCur(s.net_profit)}</td>
<td style={{fontFamily:'var(--mono)'}}>{s.total_transactions}</td>
<td>
<div style={{display:'flex',gap:4}}>
<button className="btn btn-ghost btn-sm" style={{padding:'4px 8px',fontSize:11,color:'var(--red)'}} onClick={()=>setConfirm({msg:'Delete this archived report?',cb:()=>deleteArchive(sid)})}>{Icon.trash}</button>
</div>
</td>
</tr>
);
})}
{filtered.length===0&&<tr><td colSpan={7} style={{textAlign:'center',padding:'30px',color:'var(--text3)'}}>No archived records found</td></tr>}
</tbody>
</table>
</div>
{confirm&&<ConfirmModal msg={confirm.msg} onYes={()=>{confirm.cb();setConfirm(null);}} onNo={()=>setConfirm(null)}/>}
</div>
);
};

const UsersPage=({currentUser})=>{
const [users,setUsers]=useState(()=>DB.get('users',[]));
const [showModal,setShowModal]=useState(false);
const [editing,setEditing]=useState(null);
const [confirm,setConfirm]=useState(null);
const empty={name:'',username:'',password:'',role:'cashier',pin:'',active:true};
const [form,setForm]=useState(empty);
const sessions=DB.get('sessions',[]);

const save=useCallback(()=>{
if(!form.name||!form.username||(!editing&&!form.password)){showToast('Name, username and password required','error');return;}
try {
const existing=DB.get('users',[]);
if(!editing&&existing.find(u=>u.username===form.username)){showToast('Username already taken','error');return;}
if(editing){
const upd=existing.map(u=>u.id===editing?{...u,...form,...(form.password?{password:form.password}:{})}:u);
DB.set('users',upd);setUsers(upd);
}else{
const nu={...form,id:uid(),createdAt:now()};
const upd=[...existing,nu];DB.set('users',upd);setUsers(upd);
}
DB.createBackup();
showToast(editing?'User updated':'User added','success');
setShowModal(false);setEditing(null);setForm(empty);
} catch (e) { showToast('Save failed','error'); }
},[form,editing,empty]);

const toggle=useCallback((id)=>{
try { const upd=users.map(u=>u.id===id?{...u,active:!u.active}:u);DB.set('users',upd);setUsers(upd); }
catch (e) { showToast('Toggle failed','error'); }
},[users]);

const getLastLogin=useCallback((uid2)=>{
try {
const s=[...sessions].filter(s=>s.userId===uid2).pop();
return s?fmtDateTime(s.loginAt):'Never';
} catch (e) { return 'Never'; }
},[sessions]);

return(
<div style={{padding:'20px',flex:1,overflow:'auto'}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<div><h2 style={{fontSize:20,fontWeight:700}}>User Management</h2></div>
<button className="btn btn-primary btn-sm" onClick={()=>{setForm(empty);setEditing(null);setShowModal(true);}}>+ Add User</button>
</div>
<div className="card" style={{padding:0,overflow:'hidden'}}>
<table>
<thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Last Login</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>{users.map(u=>(
<tr key={u.id}>
<td><div style={{fontWeight:500}}>{u.name}</div></td>
<td style={{fontFamily:'var(--mono)',fontSize:12}}>{u.username}</td>
<td><span className={`badge ${u.role==='admin'?'badge-purple':'badge-blue'}`}>{u.role}</span></td>
<td style={{fontSize:12,color:'var(--text2)'}}>{getLastLogin(u.id)}</td>
<td><span className={`badge ${u.active?'badge-green':'badge-red'}`}>{u.active?'Active':'Inactive'}</span></td>
<td><div style={{display:'flex',gap:6}}>
<button className="btn btn-ghost btn-sm" style={{padding:'5px 8px'}} onClick={()=>{setForm({...u,password:''});setEditing(u.id);setShowModal(true);}}>{Icon.edit}</button>
{u.id!==currentUser.id&&<button className="btn btn-ghost btn-sm" style={{padding:'5px 8px',color:u.active?'var(--red)':'var(--green)'}} onClick={()=>toggle(u.id)}>{u.active?'Disable':'Enable'}</button>}
</div></td>
</tr>
))}</tbody>
</table>
</div>

{showModal&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:420}}>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}>
<h3>{editing?'Edit User':'Add User'}</h3>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowModal(false)}>✕</button>
</div>
<div className="form-row"><label>Full Name *</label><input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} style={{width:'100%'}}/></div>
<div className="form-row"><label>Username *</label><input value={form.username} onChange={e=>setForm(p=>({...p,username:e.target.value}))} style={{width:'100%'}}/></div>
<div className="form-row"><label>{editing?'New Password (leave blank to keep current)':'Password *'}</label><input type="password" value={form.password} onChange={e=>setForm(p=>({...p,password:e.target.value}))} style={{width:'100%'}}/></div>
<div className="form-row cols2">
<div><label>Role</label>
<select value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))} style={{width:'100%'}}>
<option value="cashier">Cashier</option><option value="admin">Admin</option>
</select>
</div>
<div><label>PIN</label><input type="password" maxLength={6} value={form.pin} onChange={e=>setForm(p=>({...p,pin:e.target.value}))} style={{width:'100%'}}/></div>
</div>
<div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:8}}>
<button className="btn btn-ghost" onClick={()=>setShowModal(false)}>Cancel</button>
<button className="btn btn-primary" onClick={save}>{editing?'Save':'Add User'}</button>
</div>
</div>
</div>
)}
{confirm&&<ConfirmModal msg={confirm.msg} onYes={()=>{confirm.cb();setConfirm(null);}} onNo={()=>setConfirm(null)}/>}
</div>
);
};

const SettingsPage=()=>{
const [settings,setSettings]=useState(()=>DB.get('settings',{}));
const [maintenanceLogs,setMaintenanceLogs]=useState(()=>DB.get('maintenanceLogs',[]));
const [showMaintModal,setShowMaintModal]=useState(false);
const [maintNotes,setMaintNotes]=useState('');
const bgRef=useRef();

const save=useCallback(()=>{DB.set('settings',settings);showToast('Settings saved','success');DB.createBackup();},[settings]);

const handleBgUpload=useCallback((e)=>{
const f=e.target.files[0];if(!f)return;
const r=new FileReader();r.onload=ev=>setSettings(p=>({...p,loginBg:ev.target.result}));r.readAsDataURL(f);
},[]);

const recordMaint=useCallback(()=>{
const log = { id: uid(), date: now(), notes: maintNotes, performedBy: 'System' };
const logs = [...maintenanceLogs, log];
DB.set('maintenanceLogs', logs);
DB.set('lastMaintenance', now());
setMaintenanceLogs(logs);
setShowMaintModal(false);setMaintNotes('');
showToast('Maintenance recorded','success');
},[maintNotes,maintenanceLogs]);

return(
<div style={{padding:'20px',flex:1,overflow:'auto'}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<div><h2 style={{fontSize:20,fontWeight:700}}>System Settings</h2></div>
<div style={{display:'flex',gap:10}}>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowMaintModal(true)}>{Icon.maintenance} Maintenance</button>
<button className="btn btn-primary" onClick={save}>Save Settings</button>
</div>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
<div className="card">
<div style={{fontWeight:600,marginBottom:14,fontSize:15}}>Store Information</div>
<div className="form-row"><label>Store Name</label><input value={settings.storeName||''} onChange={e=>setSettings(p=>({...p,storeName:e.target.value}))} style={{width:'100%'}}/></div>
<div className="form-row"><label>Tagline</label><input value={settings.storeTagline||''} onChange={e=>setSettings(p=>({...p,storeTagline:e.target.value}))} style={{width:'100%'}}/></div>
<div className="form-row"><label>Address</label><input value={settings.storeAddress||''} onChange={e=>setSettings(p=>({...p,storeAddress:e.target.value}))} style={{width:'100%'}}/></div>
<div className="form-row"><label>Telephone</label><input value={settings.storeTel||''} onChange={e=>setSettings(p=>({...p,storeTel:e.target.value}))} style={{width:'100%'}}/></div>
<div className="form-row"><label>Receipt Footer Message</label><textarea value={settings.receiptFooter||''} onChange={e=>setSettings(p=>({...p,receiptFooter:e.target.value}))} style={{width:'100%',height:70,resize:'vertical'}}/></div>
</div>
<div className="card">
<div style={{fontWeight:600,marginBottom:14,fontSize:15}}>Appearance</div>
<div className="form-row">
<label>Login Background Image</label>
<div style={{border:'2px dashed var(--border)',borderRadius:'var(--radius)',padding:16,textAlign:'center',cursor:'pointer'}} onClick={()=>bgRef.current.click()}>
{settings.loginBg?<img src={settings.loginBg} alt="" style={{maxWidth:'100%',maxHeight:100,objectFit:'contain',borderRadius:6}}/>:
<div style={{color:'var(--text3)',fontSize:13}}>{Icon.img}<div style={{marginTop:6}}>Click to upload login background</div></div>}
</div>
<input type="file" accept="image/*" ref={bgRef} style={{display:'none'}} onChange={handleBgUpload}/>
{settings.loginBg&&<button className="btn btn-ghost btn-sm" style={{marginTop:8,width:'100%'}} onClick={()=>setSettings(p=>({...p,loginBg:''}))}>Remove Background</button>}
</div>
<div className="form-row cols2">
<div><label>Primary Color</label><input type="color" value={settings.primaryColor||'#4f8ef7'} onChange={e=>setSettings(p=>({...p,primaryColor:e.target.value}))} style={{width:'100%',height:40,cursor:'pointer'}}/></div>
<div><label>Tax Rate (%)</label><input type="number" value={settings.taxRate||0} onChange={e=>setSettings(p=>({...p,taxRate:e.target.value}))} style={{width:'100%'}}/></div>
</div>
</div>
</div>

<div className="card" style={{marginTop:16}}>
<div style={{fontWeight:600,marginBottom:14,fontSize:15}}>Data Management</div>
<div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
<button className="btn btn-ghost btn-sm" onClick={()=>{
try {
const data={products:DB.get('products',[]),transactions:DB.get('transactions',[]),expenses:DB.get('expenses',[]),categories:DB.get('categories',[]),shifts:DB.get('shifts',[]),adminSalesHistory:DB.get('adminSalesHistory',[])};
const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));
a.download='branch_pos_backup.json';a.click();
showToast('Backup exported','success');
} catch (e) { showToast('Export failed','error'); }
}}>{Icon.download} Export Backup (JSON)</button>
<button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={()=>{
if(window.confirm('This will clear ALL transaction and expense data. Are you sure?')){
DB.set('transactions',[]);DB.set('expenses',[]);DB.set('shifts',[]);DB.set('adminSalesHistory',[]);DB.set('activeShifts',{});
showToast('Data cleared','info');
}
}}>{Icon.trash} Clear All Data</button>
<button className="btn btn-ghost btn-sm" onClick={()=>{DB.repairData();}}>🔧 Repair Data</button>
<button className="btn btn-ghost btn-sm" onClick={()=>{DB.recoverFromBackup();window.location.reload();}}>↩️ Recover from Backup</button>
</div>
</div>

<div className="card" style={{marginTop:16}}>
<div style={{fontWeight:600,marginBottom:14,fontSize:15}}>Maintenance History</div>
<div style={{maxHeight:200,overflow:'auto'}}>
{maintenanceLogs.length===0?<p style={{color:'var(--text3)',fontSize:13}}>No maintenance records yet.</p>:
maintenanceLogs.slice().reverse().map(log=>{
const logId = log.id || uid();
return (
<div key={logId} style={{padding:'8px 0',borderBottom:'1px solid var(--border)',fontSize:13}}>
<span style={{color:'var(--text2)'}}>{fmtDateTime(log.date)}</span>
<span style={{marginLeft:10,color:'var(--accent)'}}>{log.notes || 'Routine maintenance'}</span>
</div>
);
})
}
</div>
</div>

<div className="card" style={{marginTop:16}}>
<div style={{fontWeight:600,marginBottom:14,fontSize:15}}>About Branch POS</div>
<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
{[['Version','2.2.0'],['Build By Justin','2026-05-26'],['License','Branch 2026']].map(([k,v])=>{
const keyId = k + '_' + v;
return (
<div key={keyId} style={{background:'var(--bg3)',borderRadius:'var(--radius)',padding:'10px 14px'}}>
<div style={{fontSize:11,color:'var(--text3)'}}>{k}</div>
<div style={{fontSize:14,fontWeight:600,marginTop:3,fontFamily:'var(--mono)'}}>{v}</div>
</div>
);
})}
</div>
</div>

{showMaintModal&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:420}}>
<h3 style={{marginBottom:16}}>{Icon.maintenance} Record Maintenance</h3>
<div className="form-row"><label>Maintenance Notes</label><textarea value={maintNotes} onChange={e=>setMaintNotes(e.target.value)} placeholder="Describe maintenance performed..." style={{width:'100%',height:80,resize:'vertical'}}/></div>
<div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
<button className="btn btn-ghost" onClick={()=>setShowMaintModal(false)}>Cancel</button>
<button className="btn btn-primary" onClick={recordMaint}>Record</button>
</div>
</div>
</div>
)}
</div>
);
};

const App=()=>{
const [user,setUser]=useState(()=>{
try{var u=sessionStorage.getItem('bpos_user');return u?JSON.parse(u):null;}catch(e){return null;}
});
const [sessionId,setSessionId]=useState(()=>sessionStorage.getItem('bpos_sid')||null);
const [page,setPage]=useState('pos');
const [collapsed,setCollapsed]=useState(false);
const {toast,showToast:_}=useToast();
const [systemReady, setSystemReady] = useState(false);

useEffect(function(){
if (navigator.storage && navigator.storage.persist) {
navigator.storage.persist().then(function(granted) {
if (granted) console.log('Persistent storage granted');
else console.warn('Persistent storage denied - data may be cleared by browser');
});
}
},[]);

useEffect(function(){
var init = async function() {
try {
await IDB.init();
var issues = DB.validateData();
if (issues.length > 0) {
console.warn('Data issues found on startup:', issues);
await DB.repairData();
}
setSystemReady(true);
} catch (e) {
console.error('System initialization failed:', e);
setSystemReady(true);
}
};
init();
},[]);

useEffect(function(){
var backupInterval = setInterval(function(){
if(user) { DB.createBackup(); }
}, 300000);
return function() { clearInterval(backupInterval); };
},[user]);

const login=useCallback(function(u,sid){
setUser(u);setSessionId(sid);
sessionStorage.setItem('bpos_user',JSON.stringify(u));
sessionStorage.setItem('bpos_sid',sid);
setPage(u.role==='admin'?'pos':'pos');
DB.createBackup();
var stores = ['products','categories','transactions','expenses','shifts','adminSalesHistory','users','settings'];
stores.forEach(function(s) {
var data = DB.get(s, null);
if (data !== null) DB.setAsync(s, data);
});
},[]);

const logout=useCallback(()=>{
try {
if(sessionId){
const sessions=DB.get('sessions',[]);
DB.set('sessions',sessions.map(s=>s.id===sessionId?{...s,logoutAt:now()}:s));
}
if(user){
const activeShifts = DB.get('activeShifts',{});
if(activeShifts[user.id]){
delete activeShifts[user.id];
DB.set('activeShifts',activeShifts);
}
}
} catch (e) { console.error('Logout error:', e); }
setUser(null);setSessionId(null);
sessionStorage.clear();
},[sessionId,user]);

useEffect(function(){
var handleBeforeUnload = function() { DB.createBackup(); };
window.addEventListener('beforeunload', handleBeforeUnload);
var handleVisibility = function() {
if (document.visibilityState === 'hidden') { DB.createBackup(); }
};
document.addEventListener('visibilitychange', handleVisibility);
return function() {
window.removeEventListener('beforeunload', handleBeforeUnload);
document.removeEventListener('visibilitychange', handleVisibility);
};
},[]);

if(!user)return<><LoginPage onLogin={login}/>{toast&&<Toast msg={toast.msg} type={toast.type}/>}</>;

const pages={
pos:<POSTerminal user={user}/>,
products:<ProductsPage user={user}/>,
inventory:<InventoryPage user={user}/>,
sales:<SalesPage user={user}/>,
expenses:<ExpensesPage user={user}/>,
reports:<ReportsPage/>,
archive:<AdminArchivePage/>,
users:<UsersPage currentUser={user}/>,
settings:<SettingsPage/>,
};

return(
<ErrorBoundary>
<div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
<Sidebar page={page} setPage={setPage} user={user} onLogout={logout} collapsed={collapsed} setCollapsed={setCollapsed}/>
<div style={{flex:1,overflow:'auto',display:'flex',flexDirection:'column'}}>
<div style={{padding:'10px 20px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
<div style={{fontSize:14,fontWeight:600,textTransform:'capitalize'}}>{page==='pos'?'POS Terminal':page==='archive'?'Admin Archive':page}</div>
<div style={{display:'flex',alignItems:'center',gap:14,fontSize:12,color:'var(--text2)'}}>
<span>{new Date().toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</span>
<span style={{display:'flex',alignItems:'center',gap:5}}>
<span style={{width:7,height:7,borderRadius:'50%',background:'var(--green)',display:'inline-block'}}/>
{user.name} <span className="badge badge-purple" style={{marginLeft:4}}>{user.role}</span>
</span>
</div>
</div>
{pages[page]||pages.pos}
</div>
{toast&&<Toast msg={toast.msg} type={toast.type}/>}
<OfflineIndicator/>
</div>
</ErrorBoundary>
);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
setTimeout(function(){ if(window.hideLoading) window.hideLoading(); }, 500);
</script>
</body>
</html>
