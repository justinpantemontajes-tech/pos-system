<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{

--green:#22c87a;--green-dim:#0d3d25;

--yellow:#f5c842;--yellow-dim:#3d3010;
--purple:#9b72f7;--purple-dim:#2a1d4a;

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
input,select,textarea{font-family:var(--font);background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 13px;border-radius:var(--radius);font-size:14px;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder{color:var(--text3)}
button{font-family:var(--font);cursor:pointer;border:none;transition:all .18s}
.btn{padding:9px 18px;border-radius:var(--radius);font-size:14px;font-weight:500}
.btn-primary{background:var(--accent);color:#fff}

.btn-success{background:var(--green);color:#fff}

.btn-danger{background:var(--red);color:#fff}

.btn-sm{padding:6px 13px;font-size:13px}

.badge-red{background:var(--red-dim);color:var(--red)}
.badge-yellow{background:var(--yellow-dim);color:var(--yellow)}
.badge-blue{background:var(--accent-dim);color:var(--accent)}

.sync-status.visible{opacity:1}

<body>
<div id="root"></div>
<div id="loading" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity .3s">
<div style="text-align:center">
<div style="width:48px;height:48px;border:4px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px"></div>
<div style="color:var(--text2);font-size:14px">Loading Branch POS...</div>
<div id="loading-error" style="color:var(--red);font-size:12px;margin-top:12px;max-width:400px;display:none"></div>
</div>
</div>
<script>
window.onerror = function(msg, url, line, col, error) {
console.error('ERROR:', msg, 'at line', line, error);
var loading = document.getElementById('loading');
var errDiv = document.getElementById('loading-error');
if (loading && errDiv) {
errDiv.style.display = 'block';
errDiv.innerHTML = '<b>Error:</b> ' + msg + '<br><small>Line ' + line + '</small><br><br><button onclick="location.reload()" style="padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer">Reload Page</button>';
}
return true;
};
window.hideLoading = function() {
var loading = document.getElementById('loading');
if (loading) { loading.style.opacity = '0'; setTimeout(function(){loading.style.display='none';}, 300); }
};
</script>
<script type="text/babel" data-presets="react">
if (typeof ReactDOM !== 'undefined' && ReactDOM.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED) {
ReactDOM.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.usingClientEntryPoint = true;
}
const {useState,useEffect,useRef,useCallback,useMemo,useReducer}=React;

// TODO: Replace SUPABASE_URL and SUPABASE_ANON_KEY with your actual credentials
const SUPABASE_URL = 'SUPABASE_URL';
const SUPABASE_ANON_KEY = 'SUPABASE_ANON_KEY';

// Initialize Supabase client with proper error handling
let supabaseClient = null;
try {
if (typeof supabase !== 'undefined' && supabase.createClient) {
if (SUPABASE_URL !== 'SUPABASE_URL' && SUPABASE_ANON_KEY !== 'SUPABASE_ANON_KEY') {
supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
console.log('Supabase client initialized');
} else {
console.warn('Supabase credentials not configured - using localStorage only');
}
}
} catch (e) {
console.error('Failed to initialize Supabase:', e);
}

/* ================================================================
SUPABASE HELPERS
================================================================ */
const SupabaseDB = {
async getProducts() {
if (!supabaseClient) return [];
try {
const { data, error } = await supabaseClient.from('products').select('*').order('id');
if (error) throw error;
return data || [];
} catch (e) {
console.error('Supabase getProducts error:', e);
return [];
}
},
async insertProduct(product) {
if (!supabaseClient) throw new Error('Supabase not connected');
try {
const { data, error } = await supabaseClient.from('products').insert(product).select();
if (error) throw error;
return data ? data[0] : null;
} catch (e) {
console.error('Supabase insertProduct error:', e);
throw e;
}
},
async updateProduct(id, updates) {
if (!supabaseClient) throw new Error('Supabase not connected');
try {
const { data, error } = await supabaseClient.from('products').update(updates).eq('id', id).select();
if (error) throw error;
return data ? data[0] : null;
} catch (e) {
console.error('Supabase updateProduct error:', e);
throw e;
}
},
async deleteProduct(id) {
if (!supabaseClient) throw new Error('Supabase not connected');
try {
const { error } = await supabaseClient.from('products').update({ active: false }).eq('id', id);
if (error) throw error;
return true;
} catch (e) {
console.error('Supabase deleteProduct error:', e);
throw e;
}
},
async getCategories() {
if (!supabaseClient) return [];
try {
const { data, error } = await supabaseClient.from('categories').select('*').order('id');
if (error) throw error;
return data || [];
} catch (e) {
console.error('Supabase getCategories error:', e);
return [];
}
},
async insertCategory(category) {
if (!supabaseClient) throw new Error('Supabase not connected');
try {
const { data, error } = await supabaseClient.from('categories').insert(category).select();
if (error) throw error;
return data ? data[0] : null;
} catch (e) {
console.error('Supabase insertCategory error:', e);
throw e;
}
},
async deleteCategory(id) {
if (!supabaseClient) throw new Error('Supabase not connected');
try {
const { error } = await supabaseClient.from('categories').delete().eq('id', id);
if (error) throw error;
return true;
} catch (e) {
console.error('Supabase deleteCategory error:', e);
throw e;
}
}
};

/* ================================================================
SERVICE WORKER REGISTRATION
================================================================ */
const registerServiceWorker = () => {
if ('serviceWorker' in navigator) {
const swCode = `
const CACHE_NAME = 'branch-pos-v2';
self.addEventListener('install', function(e) {
e.waitUntil(
caches.open(CACHE_NAME).then(function(cache) {
return cache.addAll(['./']);
}).catch(function() {}).then(function() {
return self.skipWaiting();
})
);
});
self.addEventListener('activate', function(e) {
e.waitUntil(
caches.keys().then(function(cacheNames) {
return Promise.all(
cacheNames.filter(function(name) { return name !== CACHE_NAME; })
.map(function(name) { return caches.delete(name); })
);
}).then(function() { return self.clients.claim(); })
);
});
self.addEventListener('fetch', function(e) {
if (e.request.method !== 'GET') return;
e.respondWith(
caches.match(e.request).then(function(cached) {
if (cached) return cached;
return fetch(e.request).then(function(response) {
if (!response || response.status !== 200 || response.type !== 'basic') return response;
var clone = response.clone();
caches.open(CACHE_NAME).then(function(cache) { cache.put(e.request, clone); });
return response;
}).catch(function() {
if (e.request.mode === 'navigate') return caches.match('./');
return new Response('Offline', { status: 503, headers: { 'Content-Type': 'text/plain' } });
});
})
);
});
`;
try {
var blob = new Blob([swCode], {type: 'application/javascript'});
var swUrl = URL.createObjectURL(blob);
navigator.serviceWorker.register(swUrl).then(function(r) {
console.log('Service Worker registered:', r.scope);
}).catch(function(e) {
console.warn('Service Worker registration failed:', e);
});
} catch(e) {
console.warn('Service Worker setup failed:', e);
}
}
};

/* ================================================================
INDEXEDDB ENGINE
================================================================ */
const IDB = {
db: null, name: 'BranchPOS_DB', version: 1,
async init() {
return new Promise((resolve, reject) => {
if (this.db) { resolve(this.db); return; }
const request = indexedDB.open(this.name, this.version);
request.onerror = () => reject(request.error);
request.onsuccess = () => { this.db = request.result; resolve(this.db); };
request.onupgradeneeded = (event) => {
const db = event.target.result;
['products','categories','transactions','expenses','restocks','shifts','adminSalesHistory','activeShifts','users','settings','sessions','maintenance','offlineQueue','backups','checksums','walLog'].forEach(store => {
if (!db.objectStoreNames.contains(store)) db.createObjectStore(store, { keyPath: 'id' });
});
};
});
},
async get(store, id) {
await this.init();
return new Promise((resolve, reject) => {
const tx = this.db.transaction(store, 'readonly');
const obj = tx.objectStore(store);
const req = id ? obj.get(id) : obj.getAll();
req.onsuccess = () => resolve(req.result);
req.onerror = () => reject(req.error);
});
},
async set(store, data) {
await this.init();
return new Promise((resolve, reject) => {
const tx = this.db.transaction(store, 'readwrite');
const obj = tx.objectStore(store);
if (Array.isArray(data)) {
obj.clear();
data.forEach(item => { if(item && item.id) obj.put(item); });
} else if (data && data.id) {
obj.put(data);
}
tx.oncomplete = () => resolve(true);
tx.onerror = () => reject(tx.error);
});
},
async add(store, item) {
await this.init();
return new Promise((resolve, reject) => {
const tx = this.db.transaction(store, 'readwrite');
const req = tx.objectStore(store).add(item);
req.onsuccess = () => resolve(req.result);
req.onerror = () => {
if (req.error && req.error.name === 'ConstraintError') {
const putReq = tx.objectStore(store).put(item);
putReq.onsuccess = () => resolve(putReq.result);
putReq.onerror = () => reject(putReq.error);
} else {
reject(req.error);
}
};
});
},
async delete(store, id) {
await this.init();
return new Promise((resolve, reject) => {
const req = this.db.transaction(store, 'readwrite').objectStore(store).delete(id);
req.onsuccess = () => resolve(true);
req.onerror = () => reject(req.error);
});
}
};

/* ================================================================
HYBRID DB LAYER
================================================================ */
const DB = {
offlineQueue: [], syncInProgress: false, lastSyncTime: null,
_lsGet(k, def) {
try { const v = localStorage.getItem('bpos_' + k); return v ? JSON.parse(v) : def; }
catch (e) { console.warn('LS read error:', e); return def; }
},
_lsSet(k, v) {
try { localStorage.setItem('bpos_' + k, JSON.stringify(v)); return true; }
catch (e) {
try {
const backups = this._lsGet('backups', []);
if (backups.length > 3) { backups.splice(0, backups.length - 3); localStorage.setItem('bpos_backups', JSON.stringify(backups)); }
localStorage.setItem('bpos_' + k, JSON.stringify(v)); return true;
} catch (e2) { console.error('LS write failed:', e2); return false; }
}
},
async getAsync(k, def) {
try {
const idbData = await IDB.get(k);
if (idbData !== undefined && idbData !== null) {
if (Array.isArray(idbData)) return idbData;
if (idbData._data !== undefined) return idbData._data;
return idbData;
}
}
catch (e) {}
return this._lsGet(k, def);
},
async setAsync(k, v) {
this._lsSet(k, v);
try {
if (Array.isArray(v)) {
await IDB.set(k, v.map((item, idx) => ({ ...item, id: item.id || (k + '_' + idx) })));
} else {
await IDB.set(k, { id: k, _data: v });
}
} catch (e) { console.warn('IDB write failed:', e); }
return true;
},
get(k, def) { return this._lsGet(k, def); },
set(k, v) { return this._lsSet(k, v); },
queueOffline(type, data) {
const queue = this._lsGet('offlineQueue', []);
queue.push({ type, data, timestamp: Date.now(), id: uid(), synced: false });
this._lsSet('offlineQueue', queue);
this.offlineQueue = queue;
},
async processOfflineQueue() {
if (this.syncInProgress || !navigator.onLine) return;
this.syncInProgress = true;
const queue = this._lsGet('offlineQueue', []);
const unsynced = queue.filter(q => !q.synced);
if (unsynced.length === 0) { this.syncInProgress = false; return; }
let processed = 0;
for (const item of unsynced) {
try {
if (item.type === 'transaction') {
const txns = this._lsGet('transactions', []);
if (!txns.find(t => t.id === item.data.id)) { txns.push(item.data); this._lsSet('transactions', txns); }
} else if (item.type === 'expense') {
const exps = this._lsGet('expenses', []);
if (!exps.find(e => e.id === item.data.id)) { exps.push(item.data); this._lsSet('expenses', exps); }
} else if (item.type === 'shift') {
const shifts = this._lsGet('shifts', []);
if (!shifts.find(s => s.shiftId === item.data.shiftId)) { shifts.push(item.data); this._lsSet('shifts', shifts); }
const archive = this._lsGet('adminSalesHistory', []);
if (!archive.find(a => a.shiftId === item.data.shiftId)) { archive.push(item.data); this._lsSet('adminSalesHistory', archive); }
}
item.synced = true; processed++;
} catch (e) { console.warn('Sync failed:', item.id, e); }
}
const remaining = queue.filter(q => !q.synced);
this._lsSet('offlineQueue', remaining);
this.offlineQueue = remaining;
this.lastSyncTime = Date.now(); this.syncInProgress = false;
if (processed > 0) showToast(processed + ' offline items synced', 'success');
},
async createBackup() {
const backup = { id: 'backup_' + Date.now(), timestamp: new Date().toISOString(),
data: { products: this._lsGet('products', []), transactions: this._lsGet('transactions', []), expenses: this._lsGet('expenses', []), categories: this._lsGet('categories', []), shifts: this._lsGet('shifts', []), adminSalesHistory: this._lsGet('adminSalesHistory', []), users: this._lsGet('users', []), settings: this._lsGet('settings', {}) },
checksums: {}
};
const stores = ['products','categories','transactions','expenses','shifts','adminSalesHistory','users','settings'];
for (var i = 0; i < stores.length; i++) {
try { backup.checksums[stores[i]] = DataIntegrity.checksum(this._lsGet(stores[i], [])); } catch (e) {}
}
const backups = this._lsGet('backups', []); backups.push(backup);
if (backups.length > 10) backups.splice(0, backups.length - 10);
this._lsSet('backups', backups);
try { await IDB.add('backups', backup); } catch (e) {}
return backup;
},
async recoverFromBackup() {
const backups = this._lsGet('backups', []);
if (backups.length === 0) return false;
const latest = backups[backups.length - 1];
if (!latest || !latest.data) return false;
Object.keys(latest.data).forEach(key => { if (latest.data[key] !== undefined) this._lsSet(key, latest.data[key]); });
showToast('Data recovered from backup (' + fmtDate(latest.timestamp) + ')', 'info'); return true;
},
validateData() {
const issues = [];
const txns = this._lsGet('transactions', []);
const seenIds = new Set();
txns.forEach(t => { if (seenIds.has(t.id)) issues.push('Dup txn:' + t.id); seenIds.add(t.id); });
const activeShifts = this._lsGet('activeShifts', {});
const activeShiftIds = Object.values(activeShifts).filter(s => s && s.status === 'active');
if (activeShiftIds.length > 1) issues.push('Multiple active shifts');
const products = this._lsGet('products', []);
if (!Array.isArray(products)) issues.push('Products corrupted');
return issues;
},
async repairData() {
const txns = this._lsGet('transactions', []);
const uniqueTxns = []; const seen = new Set();
txns.forEach(t => { if (!seen.has(t.id)) { seen.add(t.id); uniqueTxns.push(t); } });
this._lsSet('transactions', uniqueTxns);
const activeShifts = this._lsGet('activeShifts', {});
const cleaned = {};
Object.keys(activeShifts).forEach(userId => { if (activeShifts[userId] && activeShifts[userId].status === 'active') cleaned[userId] = activeShifts[userId]; });
this._lsSet('activeShifts', cleaned);
showToast('Data repaired', 'success'); return true;
}
};

/* ================================================================
CHECKSUM & DATA INTEGRITY HELPERS
================================================================ */
const DataIntegrity = {
_hash(str) {
let h = 0;
for (let i = 0; i < str.length; i++) {
const c = str.charCodeAt(i);
h = ((h << 5) - h) + c;
h = h & h;
}
return Math.abs(h).toString(36);
},
checksum(data) {
try { return this._hash(JSON.stringify(data)); } catch (e) { return '0'; }
},
async verify(store, id) {
try {
const data = await IDB.get(store, id);
const stored = await IDB.get('checksums', store + '_' + id);
if (!stored) return true;
return stored.checksum === this.checksum(data);
} catch (e) { return true; }
},
async save(store, id, data) {
const cs = this.checksum(data);
await IDB.set('checksums', { id: store + '_' + id, checksum: cs, timestamp: Date.now() });
}
};

/* ================================================================
WRITE-AHEAD LOG (WAL) for crash recovery
================================================================ */
const WAL = {
async log(operation, store, data) {
try {
const entry = { id: 'wal_' + Date.now() + '_' + Math.random().toString(36).slice(2,6), operation, store, data, timestamp: Date.now(), committed: false };
await IDB.add('walLog', entry);
return entry.id;
} catch (e) { return null; }
},
async commit(walId) {
try {
const logs = await IDB.get('walLog');
const entry = logs.find(l => l.id === walId);
if (entry) { entry.committed = true; await IDB.set('walLog', entry); }
} catch (e) {}
},
async cleanup(maxAge) {
try {
const logs = await IDB.get('walLog');
const cutoff = Date.now() - (maxAge || 86400000);
const toKeep = logs.filter(l => !l.committed || l.timestamp > cutoff);
if (toKeep.length !== logs.length) await IDB.set('walLog', toKeep);
} catch (e) {}
}
};

/* ================================================================

================================================================ */
const AutoSave = {
_pending: {},
_timers: {},
schedule(key, data, delay) {
delay = delay || 500;
if (this._timers[key]) clearTimeout(this._timers[key]);
this._pending[key] = data;
this._timers[key] = setTimeout(() => {
try {
DB.set(key, this._pending[key]);
delete this._pending[key];
} catch (e) { console.warn('Auto-save failed for', key, e); }
}, delay);
},
flush() {
Object.keys(this._pending).forEach(key => {
try { DB.set(key, this._pending[key]); } catch (e) {}
});
this._pending = {};
Object.values(this._timers).forEach(t => clearTimeout(t));
this._timers = {};
}
};

var BarcodeEngine = {
_buffer: '',
_lastScan: 0,
_minLength: 4,
_scanInterval: 50,
init: function(onScan) {
document.addEventListener('keydown', function(e) {
var now = Date.now();
var timeDiff = now - BarcodeEngine._lastScan;
if (timeDiff > BarcodeEngine._scanInterval + 30) {
BarcodeEngine._buffer = '';
}
BarcodeEngine._lastScan = now;
if (e.ctrlKey || e.altKey || e.metaKey) return;
if (e.key === 'Enter') {
if (BarcodeEngine._buffer.length >= BarcodeEngine._minLength) {
e.preventDefault();
var code = BarcodeEngine._buffer.trim();
BarcodeEngine._buffer = '';
if (onScan && code) onScan(code);
} else {
BarcodeEngine._buffer = '';
}
return;
}
if (e.key.length === 1) {
BarcodeEngine._buffer += e.key;
}
});
},
clear: function() { this._buffer = ''; }
};

/* ─── TOAST ─── */
let toastCb=null;
const Toast=({msg,type})=>{
const colors={ success:'background:var(--green-dim);color:var(--green);border:1px solid #0a4d1e', error:'background:var(--red-dim);color:var(--red);border:1px solid #6a1515', warn:'background:var(--yellow-dim);color:var(--yellow);border:1px solid #6a5500', info:'background:var(--accent-dim);color:var(--accent2);border:1px solid var(--border2)' };
return <div className="toast" style={{cssText:colors[type]||colors.info}}>{msg}</div>;
};
const useToast=()=>{
const [toast,setToast]=useState(null);
toastCb=useCallback((msg,type='info')=>{ setToast({msg,type}); setTimeout(()=>setToast(null),3000); },[]);
return {toast,showToast:toastCb};
};
const showToast=(msg,type='info')=>{if(toastCb)toastCb(msg,type);};

/* ─── ERROR BOUNDARY ─── */
class ErrorBoundary extends React.Component {
constructor(props) { super(props); this.state = { hasError: false, error: null }; }
static getDerivedStateFromError(error) { return { hasError: true, error }; }
componentDidCatch(error, errorInfo) { console.error('POS Error:', error, errorInfo); try { DB.createBackup(); } catch (e) {} }
render() {
if (this.state.hasError) {
return (
<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
<div className="card" style={{maxWidth:500,textAlign:'center'}}>
<div style={{fontSize:48,marginBottom:16}}>⚠️</div>
<h2 style={{marginBottom:12}}>Something went wrong</h2>
<p style={{color:'var(--text2)',marginBottom:20,fontSize:14}}>The system encountered an error but your data is safe. Please refresh or restore from backup.</p>
<div style={{display:'flex',gap:10,justifyContent:'center'}}>
<button className="btn btn-primary" onClick={()=>window.location.reload()}>Refresh Page</button>
<button className="btn btn-ghost" onClick={()=>{DB.recoverFromBackup();window.location.reload();}}>Restore from Backup</button>
</div>
{this.state.error && <div style={{marginTop:20,padding:12,background:'var(--bg3)',borderRadius:'var(--radius)',fontSize:11,color:'var(--text3)',textAlign:'left',fontFamily:'var(--mono)'}}>{String(this.state.error)}</div>}
</div>
</div>
);
}
return this.props.children;
}
}

/* ─── SYNC STATUS ─── */
const SyncStatus = () => {
const [status, setStatus] = useState({ visible: false, text: '', type: '' });
useEffect(() => {
const checkSync = () => {
const queue = DB.get('offlineQueue', []);
const unsynced = queue.filter(q => !q.synced).length;
if (DB.syncInProgress) { setStatus({ visible: true, text: 'Syncing...', type: 'syncing' }); }
else if (unsynced > 0) { setStatus({ visible: true, text: unsynced + ' pending', type: 'syncing' }); }
else if (DB.lastSyncTime && Date.now() - DB.lastSyncTime < 5000) { setStatus({ visible: true, text: 'Synced', type: 'synced' }); setTimeout(() => setStatus(s => ({...s, visible: false})), 2000); }
else { setStatus(s => ({...s, visible: false})); }
};
const interval = setInterval(checkSync, 1000);
return () => clearInterval(interval);
}, []);
return <div className={`sync-status ${status.visible ? 'visible' : ''} ${status.type}`}>{status.text}</div>;
};

/* ─── POS TERMINAL ─── */
const POSTerminal=({user})=>{
const [products,setProducts]=useState([]);
const [categories,setCategories]=useState([]);
const [cart,setCart]=useState([]);
const [search,setSearch]=useState('');
const [catFilter,setCatFilter]=useState('all');
const [payMode,setPayMode]=useState('cash');
const [cashInput,setCashInput]=useState('');
const [discount,setDiscount]=useState('');
const [discountType,setDiscountType]=useState('percent');
const [customerName,setCustomerName]=useState('');
const [showReceipt,setShowReceipt]=useState(null);
const [showPayModal,setShowPayModal]=useState(false);
const [barcodeInput,setBarcodeInput]=useState('');
const [shiftInfo,setShiftInfo]=useState(()=>getOrCreateShift(user));
const barcodeRef=useRef();
const settings=DB.get('settings',{});
const [updateTick,setUpdateTick]=useState(0);
const isOnline = useOfflineStatus();

useEffect(() => {
async function loadData() {
try {
const [prodData, catData] = await Promise.all([
SupabaseDB.getProducts(),
SupabaseDB.getCategories()
]);
const activeProds = prodData.filter(p => p.active !== false);
setProducts(activeProds);
setCategories(catData);
DB.set('products', prodData);
DB.set('categories', catData);
} catch (e) {
console.error('Failed to load from Supabase:', e);
const cachedProds = DB.get('products', []);
const cachedCats = DB.get('categories', []);
setProducts(cachedProds.filter(p => p.active !== false));
setCategories(cachedCats);
showToast('Using cached data (offline)', 'warn');
}
}
loadData();
}, []);

useEffect(function() {
BarcodeEngine.init(function(code) {
checkBarcode(code);
});
return function() { BarcodeEngine.clear(); };
}, [products]);

function getOrCreateShift(user){
try {
const activeShifts = DB.get('activeShifts',{});
if(activeShifts[user.id] && activeShifts[user.id].status === 'active'){
return activeShifts[user.id];
}
const shifts = DB.get('shifts',[]);
const userShifts = shifts.filter(s=>s.cashierId===user.id);
const shiftNumber = userShifts.length + 1;
const newShift = {
shiftId: 'SHIFT-'+Date.now(), shiftNumber, cashierId: user.id, cashierName: user.name,
startTime: now(), date: today(), status: 'active'
};
activeShifts[user.id] = newShift;
DB.set('activeShifts',activeShifts);
return newShift;
} catch (e) {
console.error('Shift creation error:', e);
return { shiftId: 'SHIFT-'+Date.now(), shiftNumber: 1, cashierId: user.id, cashierName: user.name, startTime: now(), date: today(), status: 'active' };
}
}

const subtotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
const discAmt=discountType==='percent'?subtotal*(Number(discount)||0)/100:Number(discount)||0;
const total=Math.max(0,subtotal-discAmt);
const change=Number(cashInput||0)-total;

const filteredProducts=useMemo(()=>{
var p=products;
if(catFilter!=='all') p=p.filter(function(pr){ return pr.categoryId===catFilter; });
if(search) {
var q=search.toLowerCase().trim();
p=p.filter(function(pr){ return pr.name.toLowerCase().includes(q)||(pr.sku||'').toLowerCase().includes(q)||(pr.barcode||'').includes(q); });
}
return p;
},[products,catFilter,search]);

const addToCart=useCallback((product)=>{
if(!product || product.stock<=0){showToast('Out of stock!','error');return;}
setCart(prev=>{
const ex=prev.find(i=>i.id===product.id);
if(ex){
if(ex.qty>=product.stock){showToast('Insufficient stock','error');return prev;}
return prev.map(i=>i.id===product.id?{...i,qty:i.qty+1}:i);
}
return [...prev,{...product,qty:1,unitPrice:product.price}];
});
},[]);

const updateQty=useCallback((id,qty)=>{
if(qty<=0){setCart(prev=>prev.filter(i=>i.id!==id));return;}
const p=products.find(pr=>pr.id===id);
if(p&&qty>p.stock){showToast('Insufficient stock','error');return;}
setCart(prev=>prev.map(i=>i.id===id?{...i,qty}:i));
},[products]);

const updatePrice=useCallback((id,price)=>{
setCart(prev=>prev.map(i=>i.id===id?{...i,price:Number(price)||0}:i));
},[]);

const checkBarcode=useCallback((code)=>{
if(!code) return;
var cleanCode = code.trim().replace(/[^\u0020-\u007E]/g, '');
if(!cleanCode) return;
var p=products.find(function(pr){ return pr.barcode===cleanCode||pr.sku===cleanCode||(pr.barcode&&pr.barcode.includes(cleanCode))||(pr.sku&&pr.sku.includes(cleanCode)); });
if(p){addToCart(p);setBarcodeInput('');showToast('Scanned: '+p.name,'success');}
else{showToast('Product not found: '+cleanCode,'error');setBarcodeInput('');}
},[products,addToCart]);

const checkout=useCallback(()=>{
if(!cart.length){showToast('Cart is empty','error');return;}
if(payMode==='cash'&&Number(cashInput)<total){showToast('Insufficient cash','error');return;}
try {
const activeShifts = DB.get('activeShifts',{});
const currentShift = activeShifts[user.id];
if(!currentShift){showToast('No active shift found. Please login again.','error');return;}
const txn={
id:'TXN'+Date.now(), shiftId: currentShift.shiftId, shiftNumber: currentShift.shiftNumber,
cashierId:user.id, cashierName:user.name, customerName:customerName||'Walk-in',
items:cart.map(i=>({id:i.id,name:i.name,qty:i.qty,unitPrice:i.unitPrice,price:i.price,subtotal:i.price*i.qty})),
subtotal, discount:discAmt, discountInput:discount, discountType,
total, payMode, cashReceived:payMode==='cash'?Number(cashInput):total,
change:payMode==='cash'?change:0, createdAt:now(), date:today(),
};
const txns=DB.get('transactions',[]);
if(txns.find(t=>t.id===txn.id)){showToast('Transaction already exists','error');return;}
txns.push(txn); DB.set('transactions',txns);
DB.setAsync('transactions',txns).catch(function(e){ console.warn('IDB sync failed:',e); });
if(!navigator.onLine){ DB.queueOffline('transaction', txn); }
const prods=DB.get('products',[]);
const updated=prods.map(p=>{ const ci=cart.find(i=>i.id===p.id); return ci?{...p,stock:p.stock-ci.qty}:p; });
DB.set('products',updated);
cart.forEach(async function(item) {
try {
const updatedProduct = updated.find(p => p.id === item.id);
if (updatedProduct && supabaseClient) {
await SupabaseDB.updateProduct(item.id, { stock: updatedProduct.stock });
}
} catch (e) {
console.warn('Supabase stock update failed for', item.id, e);
}
});
setProducts(updated.filter(p=>p.active!==false));
const shiftTxns = txns.filter(t=>t.shiftId===currentShift.shiftId);
currentShift.totalSales = shiftTxns.reduce((s,t)=>s+t.total,0);
currentShift.totalTransactions = shiftTxns.length;
currentShift.cashSales = shiftTxns.filter(t=>t.payMode==='cash').reduce((s,t)=>s+t.total,0);
currentShift.gcashSales = shiftTxns.filter(t=>t.payMode==='gcash').reduce((s,t)=>s+t.total,0);
currentShift.cardSales = shiftTxns.filter(t=>t.payMode==='card').reduce((s,t)=>s+t.total,0);
activeShifts[user.id] = currentShift;
DB.set('activeShifts',activeShifts);
DB.createBackup();
try {
PrintEngine.printReceipt(txn, settings);
} catch (e) { console.warn('Auto-print failed:', e); }
setShowReceipt(txn);
setCart([]);setCashInput('');setDiscount('');setCustomerName('');setPayMode('cash');
showToast('Transaction complete!','success');
setShowPayModal(false);
setUpdateTick(t=>t+1);
} catch (e) {
console.error('Checkout error:', e);
showToast('Checkout failed. Please try again.','error');
}
},[cart,payMode,cashInput,total,change,user,discAmt,discount,discountType,customerName]);

const cats=[{id:'all',name:'All',color:'#4f8ef7'},...categories];
return(
<div style={{display:'flex',height:'calc(100vh - 0px)',overflow:'hidden'}}>
<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',padding:'16px',gap:12}}>
<div style={{display:'flex',gap:10,alignItems:'center'}}>
<div className="search-box" style={{flex:1}}>
{Icon.search}
<input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search products..." style={{width:'100%'}}/>
</div>
<div style={{position:'relative'}}>
<input ref={barcodeRef} value={barcodeInput} onChange={e=>setBarcodeInput(e.target.value)}
onKeyDown={e=>e.key==='Enter'&&checkBarcode(barcodeInput)}
placeholder="Scan barcode..." style={{width:180}}/>
</div>
</div>
<div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
{cats.map(c=>(
<button key={c.id} className={`chip${catFilter===c.id?' active':''}`} onClick={()=>setCatFilter(c.id)}>{c.name}</button>
))}
</div>
<div style={{flex:1,overflowY:'auto',display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:10,alignContent:'start'}}>
{filteredProducts.map(p=>(
<div key={p.id} className="pos-key" onClick={()=>addToCart(p)} style={{position:'relative',textAlign:'left',padding:12}}>
{Number(p.stock||0)<=Number(p.lowStockAlert||0)&&<span className="badge badge-yellow" style={{position:'absolute',top:6,right:6,fontSize:9}}>LOW</span>}
{p.stock<=0&&<span className="badge badge-red" style={{position:'absolute',top:6,right:6,fontSize:9}}>OUT</span>}
<div style={{fontSize:11,color:'var(--text3)',marginBottom:2}}>{categories.find(c=>c.id===p.categoryId)?.name||''}</div>
<div style={{fontSize:13,fontWeight:600,lineHeight:1.3,marginBottom:6}}>{p.name}</div>
<div style={{fontSize:15,fontWeight:700,color:'var(--accent)',fontFamily:'var(--mono)'}}>{fmtCur(p.price)}</div>

<span>Order Cart</span>
{cart.length>0&&<button className="btn btn-ghost btn-sm" onClick={()=>setCart([])}>Clear</button>}
</div>
<div style={{flex:1,overflowY:'auto',padding:'8px 12px'}}>
{cart.length===0?<div style={{textAlign:'center',padding:'40px 20px',color:'var(--text3)',fontSize:13}}>Cart is empty.<br/>Click products to add.</div>:
cart.map(item=>(
<div key={item.id} style={{padding:'10px 8px',borderBottom:'1px solid var(--border)',display:'flex',gap:8,alignItems:'center'}}>
<div style={{flex:1,minWidth:0}}>
<div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
<input type="number" value={item.price} onChange={e=>updatePrice(item.id,e.target.value)} style={{width:'100%',marginTop:4,padding:'3px 7px',fontSize:12}}/>

<div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
<button className="btn btn-ghost btn-sm" style={{padding:'2px 7px',fontSize:14}} onClick={()=>updateQty(item.id,item.qty+1)}>+</button>
<span style={{fontFamily:'var(--mono)',fontSize:14,fontWeight:600,minWidth:24,textAlign:'center'}}>{item.qty}</span>
<button className="btn btn-ghost btn-sm" style={{padding:'2px 7px',fontSize:14}} onClick={()=>updateQty(item.id,item.qty-1)}>-</button>

<div style={{textAlign:'right',minWidth:70}}>
<div style={{fontFamily:'var(--mono)',fontSize:13,fontWeight:600}}>{fmtCur(item.price*item.qty)}</div>
<button style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer',fontSize:11}} onClick={()=>setCart(prev=>prev.filter(i=>i.id!==item.id))}>remove</button>
</div>
</div>
))}
</div>
<div style={{padding:'12px 16px',borderTop:'1px solid var(--border)'}}>
<div style={{marginBottom:10}}>
<label>Customer Name (optional)</label>
<input value={customerName} onChange={e=>setCustomerName(e.target.value)} placeholder="Walk-in" style={{width:'100%'}}/>
</div>
<div style={{display:'flex',gap:8,marginBottom:10}}>
<div style={{flex:1}}>
<label>Discount</label>
<input type="number" value={discount} onChange={e=>setDiscount(e.target.value)} placeholder="0" style={{width:'100%'}}/>
</div>
<div style={{width:90}}>
<label>Type</label>
<select value={discountType} onChange={e=>setDiscountType(e.target.value)} style={{width:'100%'}}>
<option value="percent">%</option>
<option value="fixed">₱</option>
</select>
</div>
</div>
<div className="divider"/>
<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--text2)',marginBottom:4}}>
<span>Subtotal</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(subtotal)}</span>
</div>
{discAmt>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--green)',marginBottom:4}}>
<span>Discount</span><span style={{fontFamily:'var(--mono)'}}>-{fmtCur(discAmt)}</span>
</div>}
<div style={{display:'flex',justifyContent:'space-between',fontSize:18,fontWeight:700,marginBottom:14}}>
<span>TOTAL</span><span style={{fontFamily:'var(--mono)',color:'var(--accent)'}}>{fmtCur(total)}</span>
</div>
<div style={{display:'flex',gap:8,marginBottom:10}}>
{['cash','gcash','card'].map(m=>(
<button key={m} className={`btn btn-sm ${payMode===m?'btn-primary':'btn-ghost'}`} style={{flex:1,textTransform:'capitalize'}} onClick={()=>setPayMode(m)}>{m}</button>
))}
</div>
{payMode==='cash'&&(
<div style={{marginBottom:10}}>
<label>Cash Received</label>
<input type="number" value={cashInput} onChange={e=>setCashInput(e.target.value)} placeholder="0.00" style={{width:'100%',fontSize:15}}/>
{cashInput&&<div style={{fontSize:12,marginTop:4,color:change>=0?'var(--green)':'var(--red)'}}>Change: {fmtCur(change)}</div>}
</div>
)}
<button className="btn btn-success" style={{width:'100%',padding:'13px',fontSize:15,fontWeight:700}} onClick={()=>cart.length&&setShowPayModal(true)} disabled={!cart.length}>
✓ Checkout {cart.length>0&&`(${fmtCur(total)})`}
</button>
</div>
</div>
{showPayModal&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:380}}>
<h3 style={{marginBottom:16}}>Confirm Payment</h3>
<div style={{background:'var(--bg3)',borderRadius:'var(--radius)',padding:14,marginBottom:16}}>
{cart.map(i=><div key={i.id} style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}}>
<span>{i.name} x{i.qty}</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(i.price*i.qty)}</span>
</div>)}
<div className="divider"/>
<div style={{display:'flex',justifyContent:'space-between',fontWeight:700}}>
<span>Total</span><span style={{fontFamily:'var(--mono)',color:'var(--accent)'}}>{fmtCur(total)}</span>
</div>
{payMode==='cash'&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginTop:4,color:'var(--green)'}}>
<span>Change</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(change)}</span>
</div>}
</div>
<div style={{display:'flex',gap:10}}>
<button className="btn btn-ghost" style={{flex:1}} onClick={()=>setShowPayModal(false)}>Back</button>
<button className="btn btn-success" style={{flex:1}} onClick={checkout}>Confirm & Pay</button>
</div>
</div>
</div>
)}
{showReceipt&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:380}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>

<div style={{display:'flex',gap:8}}>
<button className="btn btn-ghost btn-sm" onClick={()=>{setTimeout(()=>window.print(),100);}}>{Icon.print} Print</button>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowReceipt(null)}>Close</button>

</div>

</div>

<span>TXN#: {showReceipt.id}</span><span>{fmtDateTime(showReceipt.createdAt)}</span>
</div>
<div style={{fontSize:11}}>Shift: {showReceipt.shiftNumber}</div>
<div style={{fontSize:11}}>Cashier: {showReceipt.cashierName}</div>
{showReceipt.customerName!=='Walk-in'&&<div style={{fontSize:11}}>Customer: {showReceipt.customerName}</div>}
<hr/>
{showReceipt.items.map((i,x)=>(
<div key={x} style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:2}}>
<span>{i.name}<br/>&nbsp;{i.qty} x {fmtCur(i.price)}</span>
<span>{fmtCur(i.subtotal)}</span>

))}

<div style={{display:'flex',justifyContent:'space-between',fontSize:11}}><span>Subtotal</span><span>{fmtCur(showReceipt.subtotal)}</span></div>
{showReceipt.discount>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:11}}><span>Discount</span><span>-{fmtCur(showReceipt.discount)}</span></div>}
<div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:12}}><span>TOTAL</span><span>{fmtCur(showReceipt.total)}</span></div>

)}
</div>
);
};

/* ─── PRODUCTS ─── */
const ProductsPage=({user})=>{
const [products,setProducts]=useState([]);
const [categories,setCategories]=useState([]);
const [search,setSearch]=useState('');
const [catFilter,setCatFilter]=useState('all');
const [showModal,setShowModal]=useState(false);
const [editing,setEditing]=useState(null);
const [showCatModal,setShowCatModal]=useState(false);
const [confirm,setConfirm]=useState(null);
const imgRef=useRef();
const empty={name:'',sku:'',categoryId:'',price:'',cost:'',stock:'',lowStockAlert:'10',barcode:'',image:null,active:true};
const [form,setForm]=useState(empty);

useEffect(() => {
async function loadData() {
try {
const [prodData, catData] = await Promise.all([
SupabaseDB.getProducts(),
SupabaseDB.getCategories()
]);
setProducts(prodData);
setCategories(catData);
DB.set('products', prodData);
DB.set('categories', catData);
} catch (e) {
console.error('Failed to load from Supabase:', e);
setProducts(DB.get('products', []));
setCategories(DB.get('categories', []));
showToast('Using cached data (offline)', 'warn');
}
}
loadData();
}, []);

const save=useCallback(async function(){
if(!form.name||!form.price){showToast('Name and price required','error');return;}
try {
var updated;
if(editing){
const updates = {
...form,
price: Number(form.price),
cost: Number(form.cost),
stock: Number(form.stock),
lowStockAlert: Number(form.lowStockAlert) || 10,
updatedAt: now()
};
await SupabaseDB.updateProduct(editing, updates);
updated = products.map(function(p){ return p.id===editing?{...p,...updates}:p; });
setProducts(updated);
DB.set('products', updated);
showToast('Product updated','success');
} else {
var np = {
...form,
id: uid(),
sku: form.sku || 'SKU'+Date.now(),
price: Number(form.price),
cost: Number(form.cost),
stock: Number(form.stock),
lowStockAlert: Number(form.lowStockAlert) || 10,
createdAt: now()
};
await SupabaseDB.insertProduct(np);
updated = [...products, np];
setProducts(updated);
DB.set('products', updated);
showToast('Product added','success');
}
setShowModal(false);setEditing(null);setForm(empty);
} catch (e) {
console.error('Save error:', e);
showToast('Save failed: ' + (e.message || 'Unknown error'),'error');
}
},[form,editing,empty,products]);

const del=useCallback(async (id)=>{
try {
await SupabaseDB.deleteProduct(id);
const updated = products.map(p=>p.id===id?{...p,active:false}:p);
setProducts(updated);
DB.set('products', updated);
showToast('Product deactivated','info');
} catch (e) {
console.error('Delete error:', e);
showToast('Delete failed: ' + (e.message || 'Unknown error'),'error');
}
},[products]);

const handleImg=useCallback((e)=>{
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=ev=>setForm(pr=>({...pr,image:ev.target.result}));
r.onerror=()=>showToast('Failed to read image','error');
r.readAsDataURL(f);
},[]);

const filtered=useMemo(()=>{
let p=products.filter(pr=>pr.active!==false);
if(catFilter!=='all')p=p.filter(pr=>pr.categoryId===catFilter);
if(search)p=p.filter(pr=>pr.name.toLowerCase().includes(search.toLowerCase())||pr.sku?.includes(search));
return p;
},[products,catFilter,search]);

const openEdit=useCallback((p)=>{setForm({...p,price:String(p.price),cost:String(p.cost),stock:String(p.stock),lowStockAlert:String(p.lowStockAlert||10)});setEditing(p.id);setShowModal(true);},[]);

const [catForm,setCatForm]=useState({name:'',color:'#4f8ef7'});
const saveCat=useCallback(async ()=>{
if(!catForm.name)return;
try {
const newCat = {id: uid(), ...catForm};
await SupabaseDB.insertCategory(newCat);
const cats=[...categories,newCat];
setCategories(cats);
DB.set('categories',cats);
setCatForm({name:'',color:'#4f8ef7'});
showToast('Category added','success');
} catch (e) {
console.error('Category save error:', e);
showToast('Failed to add category: ' + (e.message || 'Unknown error'),'error');
}
},[catForm,categories]);

const delCat=useCallback(async (id)=>{
try {
await SupabaseDB.deleteCategory(id);
const cats=categories.filter(c=>c.id!==id);
setCategories(cats);
DB.set('categories',cats);
} catch (e) {
console.error('Category delete error:', e);
showToast('Failed to delete category','error');
}
},[categories]);

return(
<div style={{padding:'20px',flex:1,overflow:'auto'}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<div>
<h2 style={{fontSize:20,fontWeight:700}}>Products</h2>
<p style={{color:'var(--text3)',fontSize:13}}>{products.filter(p=>p.active!==false).length} active products</p>
</div>
<div style={{display:'flex',gap:10}}>
{user.role==='admin'&&<button className="btn btn-ghost btn-sm" onClick={()=>setShowCatModal(true)}>{Icon.category} Categories</button>}
<button className="btn btn-primary btn-sm" onClick={()=>{setForm(empty);setEditing(null);setShowModal(true);}}>+ Add Product</button>
</div>
</div>
<div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>
<div className="search-box" style={{width:260}}>{Icon.search}<input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search products..."/></div>
{[{id:'all',name:'All'},...categories].map(c=>(
<button key={c.id} className={`chip${catFilter===c.id?' active':''}`} onClick={()=>setCatFilter(c.id)}>{c.name}</button>
))}
</div>
<div className="card" style={{padding:0,overflow:'hidden'}}>
<table>
<thead><tr><th>Product</th><th>SKU / Barcode</th><th>Category</th><th>Price</th><th>Cost</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>
{filtered.map(p=>(
<tr key={p.id}>
<td><div style={{display:'flex',alignItems:'center',gap:10}}>
{p.image?<img src={p.image} alt="" className="product-img"/>:<div className="img-placeholder">{Icon.img}</div>}
<div><div style={{fontWeight:500}}>{p.name}</div></div>
</div></td>
<td><div style={{fontFamily:'var(--mono)',fontSize:12}}>{p.sku}</div><div style={{fontSize:11,color:'var(--text3)'}}>{p.barcode||'—'}</div></td>
<td>{categories.find(c=>c.id===p.categoryId)?.name||'—'}</td>
<td style={{fontFamily:'var(--mono)',fontWeight:600,color:'var(--accent)'}}>{fmtCur(p.price)}</td>
<td style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--text2)'}}>{fmtCur(p.cost)}</td>
<td><span className={`badge ${Number(p.stock||0)<=0?'badge-red':Number(p.stock||0)<=Number(p.lowStockAlert||0)?'badge-yellow':'badge-green'}`}>{Number(p.stock||0)}</span></td>
<td><span className="badge badge-green">Active</span></td>
<td><div style={{display:'flex',gap:6}}>
<button className="btn btn-ghost btn-sm" style={{padding:'5px 8px'}} onClick={()=>openEdit(p)}>{Icon.edit}</button>
{user.role==='admin'&&<button className="btn btn-ghost btn-sm" style={{padding:'5px 8px',color:'var(--red)'}} onClick={()=>setConfirm({msg:`Delete "${p.name}"?`,cb:()=>del(p.id)})}>{Icon.trash}</button>}
</div></td>
</tr>
))}
{filtered.length===0&&<tr><td colSpan={8} style={{textAlign:'center',padding:'30px',color:'var(--text3)'}}>No products found</td></tr>}
</tbody>
</table>
</div>
{showModal&&(
<div className="modal-overlay">
<div className="modal modal-lg">
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<h3>{editing?'Edit Product':'Add Product'}</h3>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowModal(false)}>✕</button>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
<div>
<div className="form-row"><label>Product Name *</label><input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} style={{width:'100%'}}/></div>
<div className="form-row cols2"><div><label>SKU</label><input value={form.sku} onChange={e=>setForm(p=>({...p,sku:e.target.value}))} style={{width:'100%'}}/></div>
<div><label>Barcode</label><input value={form.barcode} onChange={e=>setForm(p=>({...p,barcode:e.target.value}))} style={{width:'100%'}}/></div></div>
<div className="form-row"><label>Category</label>
<select value={form.categoryId} onChange={e=>setForm(p=>({...p,categoryId:e.target.value}))} style={{width:'100%'}}>
<option value="">Select category</option>
{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
</select>
</div>
<div className="form-row cols2">
<div><label>Selling Price *</label><input type="number" value={form.price} onChange={e=>setForm(p=>({...p,price:e.target.value}))} style={{width:'100%'}}/></div>
<div><label>Cost Price</label><input type="number" value={form.cost} onChange={e=>setForm(p=>({...p,cost:e.target.value}))} style={{width:'100%'}}/></div>
</div>
<div className="form-row cols2">
<div><label>Stock Quantity</label><input type="number" value={form.stock} onChange={e=>setForm(p=>({...p,stock:e.target.value}))} style={{width:'100%'}}/></div>
<div><label>Low Stock Alert</label><input type="number" value={form.lowStockAlert} onChange={e=>setForm(p=>({...p,lowStockAlert:e.target.value}))} style={{width:'100%'}}/></div>
</div>
</div>
<div style={{display:'flex',flexDirection:'column',gap:14}}>
<div>
<label>Product Image</label>
<div style={{border:'2px dashed var(--border)',borderRadius:'var(--radius2)',padding:20,textAlign:'center',cursor:'pointer'}} onClick={()=>imgRef.current.click()}>
{form.image?<img src={form.image} alt="" style={{maxWidth:'100%',maxHeight:140,borderRadius:'var(--radius)',objectFit:'contain'}}/>:
<div style={{color:'var(--text3)'}}>{Icon.img}<div style={{marginTop:8,fontSize:13}}>Click to upload image</div></div>}
</div>
<input type="file" accept="image/*" ref={imgRef} style={{display:'none'}} onChange={handleImg}/>
{form.image&&<button className="btn btn-ghost btn-sm" style={{marginTop:8,width:'100%'}} onClick={()=>setForm(p=>({...p,image:null}))}>Remove Image</button>}
</div>
<div>
<label>Active</label>
<label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',marginTop:6}}>
<input type="checkbox" checked={form.active!==false} onChange={e=>setForm(p=>({...p,active:e.target.checked}))} style={{width:'auto'}}/>
<span style={{fontSize:13}}>Product is active and visible in POS</span>
</label>
</div>
</div>
</div>
<div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:20}}>
<button className="btn btn-ghost" onClick={()=>setShowModal(false)}>Cancel</button>
<button className="btn btn-primary" onClick={save}>{editing?'Save Changes':'Add Product'}</button>
</div>
</div>
</div>
)}
{showCatModal&&(
<div className="modal-overlay">
<div className="modal">
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
<h3>Manage Categories</h3>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowCatModal(false)}>✕</button>
</div>
<div style={{display:'flex',gap:10,marginBottom:14}}>
<input value={catForm.name} onChange={e=>setCatForm(p=>({...p,name:e.target.value}))} placeholder="Category name" style={{flex:1}}/>
<input type="color" value={catForm.color} onChange={e=>setCatForm(p=>({...p,color:e.target.value}))} style={{width:44,padding:'2px 4px',cursor:'pointer'}}/>
<button className="btn btn-primary btn-sm" onClick={saveCat}>Add</button>
</div>
<div style={{display:'flex',flexDirection:'column',gap:6}}>
{categories.map(c=>(
<div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'var(--bg3)',borderRadius:'var(--radius)'}}>
<div style={{width:14,height:14,borderRadius:'50%',background:c.color,flexShrink:0}}/>
<span style={{flex:1,fontSize:14}}>{c.name}</span>
<button className="btn btn-ghost btn-sm" style={{color:'var(--red)',padding:'3px 8px'}} onClick={()=>delCat(c.id)}>{Icon.trash}</button>
</div>
))}
</div>
</div>
</div>
)}
{confirm&&<ConfirmModal msg={confirm.msg} onYes={()=>{confirm.cb();setConfirm(null);}} onNo={()=>setConfirm(null)}/>}
</div>
);
};

/* ── INVENTORY ─── */
const InventoryPage=({user})=>{
const [products,setProducts]=useState([]);
const [restocks,setRestocks]=useState(()=>DB.get('restocks',[]));
const [showModal,setShowModal]=useState(false);
const [form,setForm]=useState({productId:'',qty:'',supplier:'',notes:'',cost:''});
const [tab,setTab]=useState('stock');
const [search,setSearch]=useState('');
const categories=DB.get('categories',[]);

useEffect(() => {
async function loadProducts() {
try {
const data = await SupabaseDB.getProducts();
setProducts(data);
DB.set('products', data);
} catch (e) {
console.error('Failed to load products from Supabase:', e);
setProducts(DB.get('products', []));
showToast('Using cached products (offline)', 'warn');
}
}
loadProducts();
}, []);

const lowStock=products.filter(p=>p.active!==false&&Number(p.stock||0)<=Number(p.lowStockAlert||0));

const addRestock=useCallback(async function(){
if(!form.productId||!form.qty){showToast('Select product and quantity','error');return;}
try {
var rec={id:uid(),...form,qty:Number(form.qty),cost:Number(form.cost||0),addedBy:user.name,createdAt:now()};
var updRest=[...restocks,rec];DB.set('restocks',updRest);setRestocks(updRest);
AutoSave.schedule('restocks', updRest);
const product = products.find(p => p.id === form.productId);
const newStock = Number(product.stock || 0) + Number(form.qty || 0);
await SupabaseDB.updateProduct(form.productId, { stock: newStock });
var prods=products.map(function(p){ return p.id===form.productId?{...p,stock:newStock}:p; });
setProducts(prods);
DB.set('products',prods);
setForm({productId:'',qty:'',supplier:'',notes:'',cost:''});
setShowModal(false);showToast('Stock updated successfully','success');
DB.createBackup();
} catch (e) {
console.error('Restock error:', e);
showToast('Restock failed: ' + (e.message || 'Unknown error'),'error');
}
},[form,user,restocks,products]);

const filtered=products.filter(p=>p.active!==false&&(search?p.name.toLowerCase().includes(search.toLowerCase()):true));

</span></td>

</>
)}
{tab==='history'&&(
<div className="card" style={{padding:0,overflow:'hidden'}}>
<table>
<thead><tr><th>Date</th><th>Product</th><th>Qty Added</th><th>Supplier</th><th>Cost</th><th>Notes</th><th>By</th></tr></thead>
<tbody>
{[...restocks].reverse().map(r=>(
<tr key={r.id}>
<td style={{fontSize:12}}>{fmtDateTime(r.createdAt)}</td>

/* ─── SALES HISTORY ─── */
const SalesPage=({user})=>{
const [,forceUpdate]=useReducer(x=>x+1,0);
const transactions = DB.get('transactions',[]);
const [dateFilter,setDateFilter]=useState(today());
const [showShiftModal,setShowShiftModal]=useState(false);
const [cashOnHand,setCashOnHand]=useState('');
const [cashFund,setCashFund]=useState('');
const [selectedTxn,setSelectedTxn]=useState(null);
const [reprintTxn,setReprintTxn]=useState(null);
const [showPrintReport,setShowPrintReport]=useState(false);
const [endedShiftData,setEndedShiftData]=useState(null);
const settings=DB.get('settings',{});

const activeShift = useMemo(()=>{
const activeShifts = DB.get('activeShifts',{});
return activeShifts[user.id] || null;
},[user.id,transactions.length,dateFilter,showShiftModal]);

const filtered = useMemo(()=>{
if(!activeShift) return [];
let txns = transactions.filter(t=>t.shiftId === activeShift.shiftId && t.cashierId === user.id);
return txns.reverse();
},[transactions,activeShift,user.id]);

const totalSales=filtered.reduce((s,t)=>s+t.total,0);
const cashSales=filtered.filter(t=>t.payMode==='cash').reduce((s,t)=>s+t.total,0);
const gcashSales=filtered.filter(t=>t.payMode==='gcash').reduce((s,t)=>s+t.total,0);
const cardSales=filtered.filter(t=>t.payMode==='card').reduce((s,t)=>s+t.total,0);
const totalTransactions=filtered.length;
const expenses=DB.get('expenses',[]).filter(e=>e.date===dateFilter && e.encodedBy === user.name).reduce((s,e)=>s+Number(e.amount),0);
const net=totalSales-expenses;

const endShift=useCallback(()=>{
if(!activeShift){showToast('No active shift found','error');return;}
try {
const coh=Number(cashOnHand)||0;
const cf=Number(cashFund)||0;
const expected=Number(cashSales||0)+Number(cf||0)-Number(expenses||0);
const diff=coh-expected;
const endTime = now();
const shiftData={
shiftId: activeShift.shiftId, shiftNumber: activeShift.shiftNumber, cashierId:user.id, cashierName:user.name,
date:dateFilter, startTime: activeShift.startTime, endTime: endTime, totalSales, totalTransactions,
cashSales, gcashSales, cardSales, otherSales: gcashSales + cardSales, expenses, net,
cashOnHand:coh, cashFund:cf, expectedCash:expected, difference:diff,
status:diff>0?'over':diff<0?'short':'exact', transactions: filtered, createdAt: endTime,
};
const shifts=DB.get('shifts',[]);
if(!shifts.find(s=>s.shiftId===shiftData.shiftId)){
DB.set('shifts',[...shifts,shiftData]);
DB.setAsync('shifts',[...shifts,shiftData]).catch(function(e){ console.warn('IDB sync failed:',e); });
}
var adminHistory = DB.get('adminSalesHistory',[]);
if(!adminHistory.find(function(a){ return a.shiftId===shiftData.shiftId; })){
var newHistory = [...adminHistory,shiftData];
DB.set('adminSalesHistory',newHistory);
DB.setAsync('adminSalesHistory',newHistory).catch(function(e){ console.warn('IDB sync failed:',e); });
}
if(!navigator.onLine){ DB.queueOffline('shift', shiftData); }
const activeShifts = DB.get('activeShifts',{});
delete activeShifts[user.id];
DB.set('activeShifts',activeShifts);
setEndedShiftData(shiftData);
setShowPrintReport(true);
DB.createBackup();
showToast('Shift #' + shiftData.shiftNumber + ' ended. ' + (diff>=0?'Over':'Short') + ': ' + fmtCur(Math.abs(diff)),'info');
setShowShiftModal(false);setCashOnHand('');setCashFund('');
if (shiftData.transactions && shiftData.transactions.length > 100) {
shiftData.transactions = shiftData.transactions.slice(-100);
}
forceUpdate();
} catch (e) { showToast('End shift failed','error'); console.error(e); }
},[activeShift,user,cashOnHand,cashFund,cashSales,expenses,totalSales,totalTransactions,net,filtered]);

const printReceipt = useCallback((txn) => { setReprintTxn(txn); setTimeout(() => window.print(), 100); },[]);
const printShiftReport = useCallback(() => { setTimeout(() => window.print(), 100); },[]);

return(
<div style={{padding:'20px',flex:1,overflow:'auto'}}>

{activeShift ? (
<p style={{color:'var(--text3)',fontSize:13}}>Shift #{activeShift.shiftNumber} • Started {fmtTime(activeShift.startTime)} • {totalTransactions} transactions</p>
) : (
<p style={{color:'var(--yellow)',fontSize:13}}>No active shift. Please login again to start a new shift.</p>
)}
</div>

<input type="date" value={dateFilter} onChange={e=>setDateFilter(e.target.value)} style={{width:160}}/>

{Icon.shift} End Shift
</button>

</div>

<table>
<thead><tr><th>TXN #</th><th>Time</th><th>Customer</th><th>Items</th><th>Discount</th><th>Total</th><th>Payment</th><th>Cashier</th><th></th></tr></thead>
<tbody>
{filtered.map(t=>(
<tr key={t.id}>
<td style={{fontFamily:'var(--mono)',fontSize:12}}>{t.id}</td>
<td style={{fontSize:12}}>{fmtTime(t.createdAt)}</td>

<td><span className={`badge ${t.payMode==='cash'?'badge-green':t.payMode==='gcash'?'badge-blue':'badge-purple'}`}>{t.payMode.toUpperCase()}</span></td>
<td style={{fontSize:12}}>{t.cashierName}</td>
<td>
<div style={{display:'flex',gap:4}}>
<button className="btn btn-ghost btn-sm" style={{padding:'4px 8px',fontSize:11}} onClick={()=>setSelectedTxn(t)}>View</button>
<button className="btn btn-ghost btn-sm" style={{padding:'4px 8px',fontSize:11}} onClick={()=>printReceipt(t)}>{Icon.print}</button>
</div>
</td>
</tr>
))}
{filtered.length===0&&<tr><td colSpan={9} style={{textAlign:'center',padding:'30px',color:'var(--text3)'}}>
{activeShift ? 'No transactions for this shift yet' : 'Start a new shift to begin selling'}
</td></tr>}
</tbody>
</table>
</div>
{showShiftModal&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:420}}>
<h3 style={{marginBottom:16,display:'flex',alignItems:'center',gap:8}}>{Icon.shift} End Shift #{activeShift?.shiftNumber}</h3>
<div style={{background:'var(--bg3)',borderRadius:'var(--radius)',padding:14,marginBottom:16}}>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Date</span><span>{dateFilter}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Start Time</span><span>{activeShift ? fmtTime(activeShift.startTime) : '—'}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Total Sales</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(totalSales)}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Cash Sales</span><span style={{fontFamily:'var(--mono)',color:'var(--green)'}}>{fmtCur(cashSales)}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>GCash Sales</span><span style={{fontFamily:'var(--mono)',color:'var(--accent2)'}}>{fmtCur(gcashSales)}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Card Sales</span><span style={{fontFamily:'var(--mono)',color:'var(--purple)'}}>{fmtCur(cardSales)}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Transactions</span><span>{totalTransactions}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Expenses</span><span style={{fontFamily:'var(--mono)',color:'var(--red)'}}>-{fmtCur(expenses)}</span></div>
<div className="divider"/>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Expected Cash</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(Number(cashSales||0)+Number(cashFund||0)-Number(expenses||0))}</span></div>
</div>
<div style={{marginBottom:12}}>
<label>Cash Fund (Starting Cash)</label>
<input type="number" value={cashFund} onChange={e=>setCashFund(e.target.value)} placeholder="Enter starting cash amount" style={{width:'100%',fontSize:16}}/>
</div>
<div style={{marginBottom:16}}>
<label>Actual Cash on Hand</label>
<input type="number" value={cashOnHand} onChange={e=>setCashOnHand(e.target.value)} placeholder="Enter amount" style={{width:'100%',fontSize:16}}/>
{cashOnHand&&(
<div style={{marginTop:8,padding:'8px 12px',borderRadius:'var(--radius)',background:Number(cashOnHand||0)>=(Number(cashSales||0)+Number(cashFund||0)-Number(expenses||0))?'var(--green-dim)':'var(--red-dim)',color:Number(cashOnHand||0)>=(Number(cashSales||0)+Number(cashFund||0)-Number(expenses||0))?'var(--green)':'var(--red)',fontSize:13,fontWeight:600}}>
{Number(cashOnHand||0)>=(Number(cashSales||0)+Number(cashFund||0)-Number(expenses||0))?'OVER':'SHORT'}: {fmtCur(Math.abs(Number(cashOnHand||0)-(Number(cashSales||0)+Number(cashFund||0)-Number(expenses||0))))}
</div>
)}
</div>
<div style={{display:'flex',gap:10}}>
<button className="btn btn-ghost" style={{flex:1}} onClick={()=>setShowShiftModal(false)}>Cancel</button>
<button className="btn btn-primary" style={{flex:1}} onClick={endShift}>End Shift & Print</button>
</div>
</div>
</div>
)}
{selectedTxn&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:420}}>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}>
<h3>Transaction Detail</h3>
<div style={{display:'flex',gap:8}}>
<button className="btn btn-ghost btn-sm" onClick={()=>printReceipt(selectedTxn)}>{Icon.print} Reprint</button>
<button className="btn btn-ghost btn-sm" onClick={()=>setSelectedTxn(null)}>✕</button>
</div>
</div>
<div style={{fontSize:12,color:'var(--text2)',marginBottom:12}}>
<div>{selectedTxn.id} • {fmtDateTime(selectedTxn.createdAt)}</div>
<div>Shift #{selectedTxn.shiftNumber} • Cashier: {selectedTxn.cashierName} • Customer: {selectedTxn.customerName}</div>
</div>
{selectedTxn.items.map((i,x)=>(
<div key={x} style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:6,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
<span>{i.name} × {i.qty}</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(i.subtotal)}</span>
</div>
))}
<div className="divider"/>
<div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}}><span style={{color:'var(--text2)'}}>Subtotal</span><span>{fmtCur(selectedTxn.subtotal)}</span></div>
{selectedTxn.discount>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4,color:'var(--green)'}}><span>Discount</span><span>-{fmtCur(selectedTxn.discount)}</span></div>}
<div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:15}}><span>Total</span><span style={{fontFamily:'var(--mono)',color:'var(--accent)'}}>{fmtCur(selectedTxn.total)}</span></div>

)}
{reprintTxn && (

<button className="btn btn-ghost btn-sm" onClick={()=>setReprintTxn(null)}>Close</button>
</div>
</div>

<div style={{fontSize:11}}>{settings.storeTel}</div>
</div>

<span>TXN#: {reprintTxn.id}</span><span>{fmtDateTime(reprintTxn.createdAt)}</span>
</div>

<div style={{fontSize:11}}>Cashier: {reprintTxn.cashierName}</div>
{reprintTxn.customerName!=='Walk-in'&&<div style={{fontSize:11}}>Customer: {reprintTxn.customerName}</div>}

{reprintTxn.items.map((i,x)=>(
<div key={x} style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:2}}>
<span>{i.name}<br/>&nbsp;{i.qty} x {fmtCur(i.price)}</span>
<span>{fmtCur(i.subtotal)}</span>

))}
<hr/>
<div style={{display:'flex',justifyContent:'space-between',fontSize:11}}><span>Subtotal</span><span>{fmtCur(reprintTxn.subtotal)}</span></div>
{reprintTxn.discount>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:11}}><span>Discount</span><span>-{fmtCur(reprintTxn.discount)}</span></div>}

</div>

</div>

const ExpensesPage=({user})=>{

const [dateFilter,setDateFilter]=useState(today());
const [form,setForm]=useState({amount:'',category:'',notes:'',receivedBy:''});

const expCats=['Supplies','Utilities','Salary/Wages','Maintenance','Food/Snacks','Transport','Miscellaneous'];

const add=useCallback(function(){
if(!form.amount||!form.category){showToast('Amount and category required','error');return;}
try {
var exp={id:uid(),...form,amount:Number(form.amount),encodedBy:user.name,date:today(),createdAt:now()};
var updated=[...expenses,exp];DB.set('expenses',updated);setExpenses(updated);
AutoSave.schedule('expenses', updated);
DB.setAsync('expenses',updated).catch(function(e){ console.warn('IDB sync failed:',e); });
setForm({amount:'',category:'',notes:'',receivedBy:''});setShowModal(false);
showToast('Expense recorded','success');
if(!navigator.onLine){ DB.queueOffline('expense', exp); }
DB.createBackup();
} catch (e) { showToast('Failed to record expense','error'); }
},[form,user,expenses]);

const del=useCallback((id)=>{
try { const updated=expenses.filter(e=>e.id!==id);DB.set('expenses',updated);setExpenses(updated); }
catch (e) { showToast('Delete failed','error'); }
},[expenses]);

const filtered=[...expenses].filter(e=>e.date===dateFilter).reverse();
const total=filtered.reduce((s,e)=>s+e.amount,0);

return(

</div><div className="stat-label">Top Category</div></div>
</div>
<div className="card" style={{padding:0,overflow:'hidden'}}>

<tbody>
{filtered.map(e=>(
<tr key={e.id}>
<td style={{fontSize:12}}>{fmtTime(e.createdAt)}</td>
<td><span className="tag">{e.category}</span></td>
<td style={{fontFamily:'var(--mono)',fontWeight:600,color:'var(--red)'}}>{fmtCur(e.amount)}</td>
<td style={{fontSize:12,color:'var(--text2)'}}>{e.notes||'—'}</td>
<td style={{fontSize:12}}>{e.receivedBy||'—'}</td>

<td>{user.role==='admin'&&<button className="btn btn-ghost btn-sm" style={{color:'var(--red)',padding:'4px 8px'}} onClick={()=>setConfirm({msg:'Delete this expense?',cb:()=>del(e.id)})}>{Icon.trash}</button>}</td>

</tbody>

{showModal&&(
<div className="modal-overlay">

<button className="btn btn-ghost btn-sm" onClick={()=>setShowModal(false)}>✕</button>
</div>
<div className="form-row"><label>Amount (₱) *</label><input type="number" value={form.amount} onChange={e=>setForm(p=>({...p,amount:e.target.value}))} style={{width:'100%',fontSize:16}}/></div>
<div className="form-row"><label>Category *</label>

/* ─── REPORTS ─── */
const ReportsPage=()=>{
const [range,setRange]=useState('daily');
const [dateFrom,setDateFrom]=useState(today());
const [dateTo,setDateTo]=useState(today());
const salesChartRef=useRef(null);
const expChartRef=useRef(null);
const chartInst=useRef([]);

const getRange=useCallback(()=>{
const txns=DB.get('transactions',[]);
const exps=DB.get('expenses',[]);
let from,to;
if(range==='daily'){from=dateTo;to=dateTo;}
else if(range==='weekly'){const d=new Date();d.setDate(d.getDate()-6);from=d.toISOString().slice(0,10);to=today();}
else if(range==='monthly'){from=today().slice(0,7)+'-01';to=today();}
else{from=today().slice(0,4)+'-01-01';to=today();}
const ft=txns.filter(t=>t.date>=from&&t.date<=to);
const fe=exps.filter(e=>e.date>=from&&e.date<=to);
return{txns:ft,exps:fe,from,to};
},[range,dateFrom,dateTo]);

const {txns,exps,from,to}=getRange();
const totalSales=txns.reduce((s,t)=>s+t.total,0);
const totalExp=exps.reduce((s,e)=>s+e.amount,0);
const netProfit=totalSales-totalExp;
const totalTransactions=txns.length;
const productSales={};
txns.forEach(t=>t.items.forEach(i=>{
if(!productSales[i.id])productSales[i.id]={name:i.name,qty:0,revenue:0};
productSales[i.id].qty+=i.qty;productSales[i.id].revenue+=i.subtotal;
}));
const topProducts=Object.values(productSales).sort((a,b)=>b.revenue-a.revenue).slice(0,8);
const dayMap={}; txns.forEach(t=>{dayMap[t.date]=(dayMap[t.date]||0)+t.total;});
const expDayMap={}; exps.forEach(e=>{expDayMap[e.date]=(expDayMap[e.date]||0)+e.amount;});
const allDates=[...new Set([...Object.keys(dayMap),...Object.keys(expDayMap)])].sort();

useEffect(function(){
chartInst.current.forEach(function(c){ try { c.destroy(); } catch(e) {} });
chartInst.current=[];
if(salesChartRef.current&&allDates.length>0){
const ctx=salesChartRef.current.getContext('2d');
const inst=new Chart(ctx,{
type:'bar',
data:{
labels:allDates.map(d=>new Date(d).toLocaleDateString('en-PH',{month:'short',day:'numeric'})),
datasets:[
{label:'Sales',data:allDates.map(d=>dayMap[d]||0),backgroundColor:'rgba(79,142,247,0.7)',borderRadius:5},
{label:'Expenses',data:allDates.map(d=>expDayMap[d]||0),backgroundColor:'rgba(240,80,80,0.7)',borderRadius:5},
]
},
options:{responsive:true,plugins:{legend:{labels:{color:'#9aa3be',font:{family:'Sora'}}}},scales:{x:{ticks:{color:'#5a6380'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#5a6380',callback:v=>'₱'+v.toLocaleString()},grid:{color:'rgba(255,255,255,0.06)'}}}}
});
chartInst.current.push(inst);
}
if(expChartRef.current&&topProducts.length>0){
const ctx=expChartRef.current.getContext('2d');
const inst=new Chart(ctx,{
type:'bar',
data:{
labels:topProducts.map(p=>p.name.length>18?p.name.slice(0,18)+'…':p.name),
datasets:[{label:'Revenue',data:topProducts.map(p=>p.revenue),backgroundColor:'rgba(34,200,122,0.7)',borderRadius:5}]
},
options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#5a6380',callback:v=>'₱'+v.toLocaleString()},grid:{color:'rgba(255,255,255,0.06)'}},y:{ticks:{color:'#9aa3be',font:{size:11}}}}}
});
chartInst.current.push(inst);
}
return()=>{chartInst.current.forEach(c=>c.destroy());chartInst.current=[];};
},[range,dateFrom,dateTo,txns.length]);

const exportCSV=useCallback(()=>{
try {
const rows=[['Date','TXN#','Customer','Total','Payment','Cashier'],...txns.map(t=>[t.date,t.id,t.customerName,t.total,t.payMode,t.cashierName])];
const csv=rows.map(r=>r.join(',')).join('\n');
const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
a.download='sales_report.csv';a.click();
} catch (e) { showToast('Export failed','error'); }
},[txns]);

return(
<div style={{padding:'20px',flex:1,overflow:'auto'}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<div><h2 style={{fontSize:20,fontWeight:700}}>Reports & Analytics</h2></div>
<div style={{display:'flex',gap:10,alignItems:'center'}}>
{['daily','weekly','monthly','yearly'].map(r=>(
<button key={r} className={`chip${range===r?' active':''}`} style={{textTransform:'capitalize'}} onClick={()=>setRange(r)}>{r}</button>
))}
{range==='daily'&&<input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} style={{width:150}}/>}
<button className="btn btn-ghost btn-sm" onClick={exportCSV}>{Icon.download} CSV</button>
</div>
</div>
<div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
<div className="stat-card"><div className="stat-val" style={{color:'var(--accent)'}}>{fmtCur(totalSales)}</div><div className="stat-label">Total Sales</div></div>
<div className="stat-card"><div className="stat-val" style={{color:'var(--red)'}}>{fmtCur(totalExp)}</div><div className="stat-label">Total Expenses</div></div>
<div className="stat-card"><div className="stat-val" style={{color:netProfit>=0?'var(--green)':'var(--red)'}}>{fmtCur(netProfit)}</div><div className="stat-label">Net Profit</div></div>
<div className="stat-card"><div className="stat-val">{totalTransactions}</div><div className="stat-label">Transactions</div></div>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:20}}>
<div className="card">
<div style={{fontWeight:600,marginBottom:12}}>Sales vs Expenses</div>
{allDates.length>0?<canvas ref={salesChartRef} height={180}/>:<div style={{textAlign:'center',padding:'40px',color:'var(--text3)',fontSize:13}}>No data for this period</div>}
</div>
<div className="card">
<div style={{fontWeight:600,marginBottom:12}}>Best-Selling Products</div>
{topProducts.length>0?<canvas ref={expChartRef} height={180}/>:<div style={{textAlign:'center',padding:'40px',color:'var(--text3)',fontSize:13}}>No sales data</div>}
</div>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
<div className="card">
<div style={{fontWeight:600,marginBottom:12}}>Top Products by Revenue</div>
<table>
<thead><tr><th>#</th><th>Product</th><th>Qty Sold</th><th>Revenue</th></tr></thead>
<tbody>{topProducts.slice(0,6).map((p,i)=>(
<tr key={i}>
<td style={{color:'var(--text3)',fontFamily:'var(--mono)'}}>{i+1}</td>
<td style={{fontSize:13}}>{p.name}</td>
<td style={{fontFamily:'var(--mono)'}}>{p.qty}</td>
<td style={{fontFamily:'var(--mono)',color:'var(--green)'}}>{fmtCur(p.revenue)}</td>
</tr>
))}</tbody>
</table>
</div>
<div className="card">
<div style={{fontWeight:600,marginBottom:12}}>Shift Reports</div>
<table>
<thead><tr><th>Date</th><th>Cashier</th><th>Sales</th><th>Cash</th><th>Status</th></tr></thead>
<tbody>{[...DB.get('shifts',[])].reverse().slice(0,8).map(s=>{
const shiftId = s.shiftId || s.id || uid();
return (
<tr key={shiftId}>
<td style={{fontSize:11}}>{s.date}</td>
<td style={{fontSize:12}}>{s.cashierName}</td>
<td style={{fontFamily:'var(--mono)',fontSize:12}}>{fmtCur(s.totalSales)}</td>
<td style={{fontFamily:'var(--mono)',fontSize:12}}>{fmtCur(s.cashOnHand)}</td>
<td><span className={`badge ${s.status==='over'?'badge-green':s.status==='short'?'badge-red':'badge-blue'}`}>{(s.status||'exact').toUpperCase()}</span></td>
</tr>
);
})}</tbody>
</table>
</div>
</div>
</div>
);
};

const UsersPage=({currentUser})=>{
const [users,setUsers]=useState(()=>DB.get('users',[]));
const [showModal,setShowModal]=useState(false);
const [editing,setEditing]=useState(null);
const [confirm,setConfirm]=useState(null);
const empty={name:'',username:'',password:'',role:'cashier',pin:'',active:true};
const [form,setForm]=useState(empty);
const sessions=DB.get('sessions',[]);

const save=useCallback(()=>{
if(!form.name||!form.username||(!editing&&!form.password)){showToast('Name, username and password required','error');return;}
try {
const existing=DB.get('users',[]);
if(!editing&&existing.find(u=>u.username===form.username)){showToast('Username already taken','error');return;}
if(editing){
const upd=existing.map(u=>u.id===editing?{...u,...form,...(form.password?{password:form.password}:{})}:u);
DB.set('users',upd);setUsers(upd);
}else{
const nu={...form,id:uid(),createdAt:now()};
const upd=[...existing,nu];DB.set('users',upd);setUsers(upd);
}
DB.createBackup();
showToast(editing?'User updated':'User added','success');
setShowModal(false);setEditing(null);setForm(empty);
} catch (e) { showToast('Save failed','error'); }
},[form,editing,empty]);

const toggle=useCallback((id)=>{
try { const upd=users.map(u=>u.id===id?{...u,active:!u.active}:u);DB.set('users',upd);setUsers(upd); }
catch (e) { showToast('Toggle failed','error'); }
},[users]);

const getLastLogin=useCallback((uid2)=>{
try {
const s=[...sessions].filter(s=>s.userId===uid2).pop();
return s?fmtDateTime(s.loginAt):'Never';
} catch (e) { return 'Never'; }
},[sessions]);

return(

<td><div style={{display:'flex',gap:6}}>

{u.id!==currentUser.id&&<button className="btn btn-ghost btn-sm" style={{padding:'5px 8px',color:u.active?'var(--red)':'var(--green)'}} onClick={()=>toggle(u.id)}>{u.active?'Disable':'Enable'}</button>}
</div></td>
</tr>
))}</tbody>
</table>

{showModal&&(
