*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0f1117;--bg2:#161920;--bg3:#1e2130;--bg4:#252a3a;

<div id="root"></div>
<div id="loading" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity .3s">
<div style="text-align:center">
<div style="width:48px;height:48px;border:4px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px"></div>
<div style="color:var(--text2);font-size:14px">Loading Branch POS...</div>
<div id="loading-error" style="color:var(--red);font-size:12px;margin-top:12px;max-width:400px;display:none"></div>
</div>
</div>
<script>
window.onerror = function(msg, url, line, col, error) {
console.error('ERROR:', msg, 'at line', line, error);
var loading = document.getElementById('loading');
var errDiv = document.getElementById('loading-error');
if (loading && errDiv) {
errDiv.style.display = 'block';
errDiv.innerHTML = '<b>Error:</b> ' + msg + '<br><small>Line ' + line + '</small><br><br><button onclick="location.reload()" style="padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer">Reload Page</button>';
}
return true;
};
window.hideLoading = function() {
var loading = document.getElementById('loading');
if (loading) { loading.style.opacity = '0'; setTimeout(function(){loading.style.display='none';}, 300); }
};
</script>

<script type="text/babel" data-presets="react">
if (typeof ReactDOM !== 'undefined' && ReactDOM.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED) {
ReactDOM.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.usingClientEntryPoint = true;
}
const {useState,useEffect,useRef,useCallback,useMemo,useReducer}=React;

const SyncEngine = {
  isSyncing: false,
  syncChannels: [],

  async syncToSupabase() {
    if (!supabaseClient || !navigator.onLine || this.isSyncing) return;
    this.isSyncing = true;
    window.dispatchEvent(new CustomEvent('sync-status', { detail: 'Syncing...' }));

    const queue = DB.get('offlineQueue', []);
    const pending = queue.filter(q => !q.synced);

    for (const item of pending) {
      try {
        if (item.type === 'transaction') {
          const { data: existing } = await supabaseClient.from('sales').select('id').eq('id', item.data.id).maybeSingle();
          if (!existing) {
            const saleData = {
              id: item.data.id,
              shift_id: item.data.shiftId,
              shift_number: item.data.shiftNumber,
              cashier_id: item.data.cashierId,
              cashier_name: item.data.cashierName,
              customer_name: item.data.customerName,
              subtotal: item.data.subtotal,
              discount: item.data.discount,
              total: item.data.total,
              pay_mode: item.data.payMode,
              cash_received: item.data.cashReceived,
              change: item.data.change,
              created_at: item.data.createdAt,
              sync_status: 'synced'
            };
            await supabaseClient.from('sales').insert(saleData);

            const itemsData = item.data.items.map(i => ({
              id: uid(),
              sale_id: item.data.id,
              product_id: i.id,
              name: i.name,
              qty: i.qty,
              weight_kg: i.weight_kg || null,
              unit_price: i.unitPrice,
              subtotal: i.subtotal
            }));
            if (itemsData.length > 0) {
              await supabaseClient.from('sale_items').insert(itemsData);
            }
          }
        } else if (item.type === 'product_update') {
          await supabaseClient.from('products').upsert(item.data);
        } else if (item.type === 'report') {
          await supabaseClient.from('reports').upsert(item.data);
        } else if (item.type === 'archive') {
          await supabaseClient.from('archives').upsert(item.data);
        } else if (item.type === 'expense') {
          await supabaseClient.from('expenses').upsert(item.data);
        } else if (item.type === 'shift') {
          await supabaseClient.from('shifts').upsert(item.data);
        }
        item.synced = true;
      } catch (e) {
        console.error('Supabase sync error for', item.id, e);
        item.sync_status = 'failed';
      }
    }

    DB.set('offlineQueue', queue);
    this.isSyncing = false;
    window.dispatchEvent(new CustomEvent('sync-status', { detail: 'Synced' }));
    setTimeout(() => window.dispatchEvent(new CustomEvent('sync-status', { detail: '' })), 3000);
  },

  setupRealtime(onProductsUpdate, onCategoriesUpdate, onTransactionsUpdate) {
    if (!supabaseClient) return function(){};

    // Clean up existing channels
    this.syncChannels.forEach(ch => { try { supabaseClient.removeChannel(ch); } catch(e) {} });
    this.syncChannels = [];

    // Products channel
    const productsChannel = supabaseClient.channel('public:products')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, payload => {
        const prods = DB.get('products', []);
        if (payload.eventType === 'DELETE') {
          const updated = prods.filter(p => p.id !== payload.old.id);
          DB.set('products', updated);
          if (onProductsUpdate) onProductsUpdate(updated);
        } else {
          const newProd = payload.new;
          const existingIdx = prods.findIndex(p => p.id === newProd.id);
          if (existingIdx >= 0) {
            prods[existingIdx] = { ...prods[existingIdx], ...newProd };
          } else {
            prods.push(newProd);
          }
          DB.set('products', prods);
          if (onProductsUpdate) onProductsUpdate(prods);
        }
      })
      .subscribe();
    this.syncChannels.push(productsChannel);

    // Categories channel
    const categoriesChannel = supabaseClient.channel('public:categories')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, payload => {
        const cats = DB.get('categories', []);
        if (payload.eventType === 'DELETE') {
          const updated = cats.filter(c => c.id !== payload.old.id);
          DB.set('categories', updated);
          if (onCategoriesUpdate) onCategoriesUpdate(updated);
        } else {
          const newCat = payload.new;
          const existingIdx = cats.findIndex(c => c.id === newCat.id);
          if (existingIdx >= 0) {
            cats[existingIdx] = { ...cats[existingIdx], ...newCat };
          } else {
            cats.push(newCat);
          }
          DB.set('categories', cats);
          if (onCategoriesUpdate) onCategoriesUpdate(cats);
        }
      })
      .subscribe();
    this.syncChannels.push(categoriesChannel);

    // Sales/Transactions channel (read-only from server)
    const salesChannel = supabaseClient.channel('public:sales')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'sales' }, payload => {
        const txns = DB.get('transactions', []);
        const exists = txns.find(t => t.id === payload.new.id);
        if (!exists) {
          txns.push(payload.new);
          DB.set('transactions', txns);
          if (onTransactionsUpdate) onTransactionsUpdate(txns);
        }
      })
      .subscribe();
    this.syncChannels.push(salesChannel);

    return () => {
      this.syncChannels.forEach(ch => { try { supabaseClient.removeChannel(ch); } catch(e) {} });
      this.syncChannels = [];
    };
  },

  async pullFromSupabase() {
    if (!supabaseClient || !navigator.onLine) return;
    try {
      window.dispatchEvent(new CustomEvent('sync-status', { detail: 'Pulling data...' }));

      const { data: remoteProducts } = await supabaseClient.from('products').select('*');
      if (remoteProducts && remoteProducts.length > 0) {
        const localProds = DB.get('products', []);
        const merged = [...localProds];
        remoteProducts.forEach(rp => {
          const idx = merged.findIndex(p => p.id === rp.id);
          if (idx >= 0) {
            const localUpdated = merged[idx].updatedAt || merged[idx].createdAt || '1970-01-01';
            const remoteUpdated = rp.updated_at || rp.created_at || '1970-01-01';
            if (new Date(remoteUpdated) >= new Date(localUpdated)) {
              merged[idx] = { ...merged[idx], ...rp, updatedAt: rp.updated_at || now() };
            }
          } else {
            merged.push(rp);
          }
        });
        DB.set('products', merged);
      }

      const { data: remoteCats } = await supabaseClient.from('categories').select('*');
      if (remoteCats && remoteCats.length > 0) {
        DB.set('categories', remoteCats);
      }

      window.dispatchEvent(new CustomEvent('sync-status', { detail: 'Synced' }));
      setTimeout(() => window.dispatchEvent(new CustomEvent('sync-status', { detail: '' })), 3000);
    } catch (e) {
      console.error('Pull from Supabase failed:', e);
    }
  }
};;

const IDB = {
db: null, name: 'BranchPOS_DB', version: 2,
async init() {
return new Promise((resolve, reject) => {
if (this.db) { resolve(this.db); return; }
const request = indexedDB.open(this.name, this.version);
request.onerror = () => reject(request.error);
request.onsuccess = () => { this.db = request.result; resolve(this.db); };
request.onupgradeneeded = (event) => {
const db = event.target.result;
['products','categories','transactions','expenses','restocks','shifts','adminSalesHistory','activeShifts','users','settings','sessions','maintenance','offlineQueue','backups','checksums','walLog','reports','archives'].forEach(store => {
if (!db.objectStoreNames.contains(store)) db.createObjectStore(store, { keyPath: 'id' });
});
};
});
},
async get(store, id) {
await this.init();
return new Promise((resolve, reject) => {
const tx = this.db.transaction(store, 'readonly');
const obj = tx.objectStore(store);
const req = id ? obj.get(id) : obj.getAll();
req.onsuccess = () => resolve(req.result);
req.onerror = () => reject(req.error);
});
},
async set(store, data) {
await this.init();
return new Promise((resolve, reject) => {
const tx = this.db.transaction(store, 'readwrite');
const obj = tx.objectStore(store);
if (Array.isArray(data)) {
obj.clear();
data.forEach(item => { if(item && item.id) obj.put(item); });
} else if (data && data.id) {
obj.put(data);
}
tx.oncomplete = () => resolve(true);
tx.onerror = () => reject(tx.error);
});
},
async add(store, item) {
await this.init();
return new Promise((resolve, reject) => {
const tx = this.db.transaction(store, 'readwrite');
const req = tx.objectStore(store).add(item);
req.onsuccess = () => resolve(req.result);
req.onerror = () => {
if (req.error && req.error.name === 'ConstraintError') {
const putReq = tx.objectStore(store).put(item);
putReq.onsuccess = () => resolve(putReq.result);
putReq.onerror = () => reject(putReq.error);
} else {
reject(req.error);
}
};
});
}
};

const DB = {
offlineQueue: [], syncInProgress: false, lastSyncTime: null,
_lsGet(k, def) {
try { const v = localStorage.getItem('bpos_' + k); return v ? JSON.parse(v) : def; }
catch (e) { return def; }
},
_lsSet(k, v) {
try { localStorage.setItem('bpos_' + k, JSON.stringify(v)); return true; }
catch (e) { return false; }
},
async getAsync(k, def) {
try {
const idbData = await IDB.get(k);
if (idbData !== undefined && idbData !== null) {
if (Array.isArray(idbData)) return idbData;
if (idbData._data !== undefined) return idbData._data;
return idbData;
}
} catch (e) {}
return this._lsGet(k, def);
},
async setAsync(k, v) {
this._lsSet(k, v);
try {
if (Array.isArray(v)) {
await IDB.set(k, v.map((item, idx) => ({ ...item, id: item.id || (k + '_' + idx) })));
} else {
await IDB.set(k, { id: k, _data: v });
}
} catch (e) { console.warn('IDB write failed:', e); }
return true;
},
get(k, def) { return this._lsGet(k, def); },
set(k, v) { 
  this._lsSet(k, v); 
  return true; 
},
queueOffline(type, data) {
const queue = this._lsGet('offlineQueue', []);
queue.push({ type, data, timestamp: Date.now(), id: uid(), synced: false, sync_status: 'pending' });
this._lsSet('offlineQueue', queue);
this.offlineQueue = queue;
if (navigator.onLine) {
  setTimeout(() => SyncEngine.syncToSupabase(), 1000);
}
},
async processOfflineQueue() {
if (this.syncInProgress || !navigator.onLine) return;
this.syncInProgress = true;
await SyncEngine.syncToSupabase();
this.lastSyncTime = Date.now(); 
this.syncInProgress = false;
},
async createBackup() {
const backup = { id: 'backup_' + Date.now(), timestamp: new Date().toISOString(),
data: { products: this._lsGet('products', []), transactions: this._lsGet('transactions', []), expenses: this._lsGet('expenses', []), categories: this._lsGet('categories', []), shifts: this._lsGet('shifts', []), adminSalesHistory: this._lsGet('adminSalesHistory', []), users: this._lsGet('users', []), settings: this._lsGet('settings', {}) }
};
const backups = this._lsGet('backups', []); backups.push(backup);
if (backups.length > 10) backups.splice(0, backups.length - 10);
this._lsSet('backups', backups);
try { await IDB.add('backups', backup); } catch (e) {}
return backup;
},
async recoverFromBackup() {
const backups = this._lsGet('backups', []);
if (backups.length === 0) return false;
const latest = backups[backups.length - 1];
if (!latest || !latest.data) return false;
Object.keys(latest.data).forEach(key => { if (latest.data[key] !== undefined) this._lsSet(key, latest.data[key]); });
showToast('Data recovered from backup', 'info'); return true;
},
validateData() {
const issues = [];
const txns = this._lsGet('transactions', []);
const seenIds = new Set();
txns.forEach(t => { if (seenIds.has(t.id)) issues.push('Dup txn:' + t.id); seenIds.add(t.id); });
return issues;
},
async repairData() {
const txns = this._lsGet('transactions', []);
const uniqueTxns = []; const seen = new Set();
txns.forEach(t => { if (!seen.has(t.id)) { seen.add(t.id); uniqueTxns.push(t); } });
this._lsSet('transactions', uniqueTxns);
showToast('Data repaired', 'success'); return true;
}
};

const useOfflineStatus = () => {
const [isOnline, setIsOnline] = useState(navigator.onLine);
const [syncStatus, setSyncStatus] = useState(navigator.onLine ? 'Online' : 'Offline');

useEffect(() => {
const handleOnline = () => { 
  setIsOnline(true); 
  setSyncStatus('Syncing...');
  showToast('Connection restored. Syncing...', 'info'); 
  DB.processOfflineQueue(); 
};
const handleOffline = () => { 
  setIsOnline(false); 
  setSyncStatus('Offline');
  showToast('Working offline. Data will sync when connected.', 'warn'); 
};
window.addEventListener('online', handleOnline);
window.addEventListener('offline', handleOffline);

const handleSyncEvent = (e) => {
  setSyncStatus(e.detail);
};
window.addEventListener('sync-status', handleSyncEvent);

const syncInterval = setInterval(() => { if (navigator.onLine) DB.processOfflineQueue(); }, 30000);
return () => { 
  window.removeEventListener('online', handleOnline); 
  window.removeEventListener('offline', handleOffline); 
  window.removeEventListener('sync-status', handleSyncEvent);
  clearInterval(syncInterval); 
};
}, []);
return { isOnline, syncStatus };
};

BarcodeEngine._buffer = '';
}

if (e.key === 'Enter') {
if (BarcodeEngine._buffer.length >= BarcodeEngine._minLength) {
e.preventDefault();
var code = BarcodeEngine._buffer.trim();
BarcodeEngine._buffer = '';
if (onScan && code) onScan(code);
} else {
BarcodeEngine._buffer = '';
}
return;
}
if (e.key.length === 1) {
BarcodeEngine._buffer += e.key;
}
});
},

};

const colors={ success:'background:var(--green-dim);color:var(--green);border:1px solid #0a4d1e', error:'background:var(--red-dim);color:var(--red);border:1px solid #6a1515', warn:'background:var(--yellow-dim);color:var(--yellow);border:1px solid #6a5500', info:'background:var(--accent-dim);color:var(--accent2);border:1px solid var(--border2)' };

const useToast=()=>{
const [toast,setToast]=useState(null);
toastCb=useCallback((msg,type='info')=>{ setToast({msg,type}); setTimeout(()=>setToast(null),3000); },[]);
return {toast,showToast:toastCb};
};
const showToast=(msg,type='info')=>{if(toastCb)toastCb(msg,type);};

class ErrorBoundary extends React.Component {
constructor(props) { super(props); this.state = { hasError: false, error: null }; }
static getDerivedStateFromError(error) { return { hasError: true, error }; }
componentDidCatch(error, errorInfo) { console.error('POS Error:', error, errorInfo); try { DB.createBackup(); } catch (e) {} }
render() {
if (this.state.hasError) {
return (
<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
<div className="card" style={{maxWidth:500,textAlign:'center'}}>
<div style={{fontSize:48,marginBottom:16}}>⚠️</div>
<h2 style={{marginBottom:12}}>Something went wrong</h2>
<p style={{color:'var(--text2)',marginBottom:20,fontSize:14}}>The system encountered an error but your data is safe. Please refresh or restore from backup.</p>
<div style={{display:'flex',gap:10,justifyContent:'center'}}>
<button className="btn btn-primary" onClick={()=>window.location.reload()}>Refresh Page</button>
<button className="btn btn-ghost" onClick={()=>{DB.recoverFromBackup();window.location.reload();}}>Restore from Backup</button>
</div>
</div>
</div>
);
}
return this.props.children;
}
}

const ConfirmModal=({msg,onYes,onNo})=>(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:380}}>
<div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
<span style={{color:'var(--red)',width:28,height:28}}>{Icon.alert}</span>
<h3 style={{fontSize:16}}>Confirm Action</h3>
</div>
<p style={{color:'var(--text2)',fontSize:14,marginBottom:20}}>{msg}</p>
<div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
<button className="btn btn-ghost btn-sm" onClick={onNo}>Cancel</button>
<button className="btn btn-danger btn-sm" onClick={onYes}>Confirm</button>
</div>
</div>
</div>
);

const OfflineIndicator = () => {
const { isOnline, syncStatus } = useOfflineStatus();
if (!isOnline) {
return (
<div className="offline-indicator">
<span style={{display:'flex',alignItems:'center',gap:6}}>{Icon.wifiOff} Offline Mode</span>
</div>
);
}
return (
<div className={`sync-status visible ${syncStatus === 'Syncing...' ? 'syncing' : syncStatus === 'Synced' ? 'synced' : 'online'}`}>
{syncStatus || 'Online'}
</div>
);
};

const LoginPage=({onLogin})=>{
const [username,setUsername]=useState('');
const [password,setPassword]=useState('');
const [err,setErr]=useState('');
const [loading,setLoading]=useState(false);
const settings=DB.get('settings',{});
const login=useCallback(()=>{
setErr('');setLoading(true);
setTimeout(()=>{
try {
const users=DB.get('users',[]);
const user=users.find(u=>u.username===username&&u.password===password&&u.active);
if(user){ const session={id:uid(),userId:user.id,loginAt:now(),logoutAt:null}; const sessions=DB.get('sessions',[]); DB.set('sessions',[...sessions,session]); onLogin(user,session.id); }
else{setErr('Invalid username or password.');}
} catch (e) { setErr('System error. Please try again.'); console.error('Login error:', e); }
setLoading(false);
},400);
},[username,password,onLogin]);
const bgStyle=settings.loginBg?{backgroundImage:`url(${settings.loginBg})`,backgroundSize:'cover',backgroundPosition:'center'}: {};
return(
<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',position:'relative',...bgStyle}}>
<div style={{position:'absolute',inset:0,background:'rgba(10,12,22,.85)',backdropFilter:'blur(8px)'}}/>
<div style={{position:'relative',zIndex:1,width:'100%',maxWidth:400,padding:'0 20px'}}>
<div style={{textAlign:'center',marginBottom:32}}>
<div style={{width:64,height:64,background:'var(--accent)',borderRadius:18,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',fontSize:28}}>🏪</div>
<h1 style={{fontSize:26,fontWeight:700,letterSpacing:'-0.5px'}}>{settings.storeName||'Branch'} <span style={{color:'var(--accent)'}}>POS</span></h1>
<p style={{color:'var(--text3)',fontSize:13,marginTop:4}}>{settings.storeTagline||'Point of Sale System'}</p>
</div>
<div className="card" style={{padding:'28px 24px'}}>
<h2 style={{fontSize:15,marginBottom:20,color:'var(--text2)'}}>Sign in to your account</h2>
{err&&<div className="alert alert-danger" style={{marginBottom:14}}>{err}</div>}
<div style={{marginBottom:14}}>
<label>Username</label>
<input type="text" placeholder="Enter username" value={username} onChange={e=>setUsername(e.target.value)} style={{width:'100%'}} onKeyDown={e=>e.key==='Enter'&&login()}/>
</div>
<div style={{marginBottom:20}}>
<label>Password</label>
<input type="password" placeholder="Enter password" value={password} onChange={e=>setPassword(e.target.value)} style={{width:'100%'}} onKeyDown={e=>e.key==='Enter'&&login()}/>
</div>
<button className="btn btn-primary" style={{width:'100%',padding:'11px'}} onClick={login} disabled={loading}>
{loading?<span className="spinner"/>:'Login'}
</button>
</div>
</div>
</div>
);
};

)}
<button className="sidebar-link" onClick={()=>setCollapsed(!collapsed)} style={{marginBottom:4}} title={collapsed?'Expand':''}>

const POSTerminal=({user})=>{
const [products,setProducts]=useState(()=>DB.get('products',[]).filter(p=>p.active!==false));
const [categories]=useState(()=>DB.get('categories',[]));
const [cart,setCart]=useState([]);
const [search,setSearch]=useState('');
const [catFilter,setCatFilter]=useState('all');
const [payMode,setPayMode]=useState('cash');
const [cashInput,setCashInput]=useState('');
const [discount,setDiscount]=useState('');
const [discountType,setDiscountType]=useState('percent');
const [customerName,setCustomerName]=useState('');
const [showReceipt,setShowReceipt]=useState(null);
const [showPayModal,setShowPayModal]=useState(false);
const [showWeightModal,setShowWeightModal]=useState(null);
const [weightInput,setWeightInput]=useState('');
const [barcodeInput,setBarcodeInput]=useState('');
const [isProcessing,setIsProcessing]=useState(false);
const [shiftInfo,setShiftInfo]=useState(()=>getOrCreateShift(user));
const barcodeRef=useRef();
const settings=DB.get('settings',{});
const { isOnline } = useOfflineStatus();

useEffect(function() {
BarcodeEngine.init(function(code) {
checkBarcode(code);
});
return function() { BarcodeEngine.clear(); };
}, [products]);

useEffect(() => {
  if (barcodeRef.current) {
    barcodeRef.current.focus();
  }
  const handleKeyDown = (e) => {
    if (e.key === 'F2') {
      e.preventDefault();
      barcodeRef.current?.focus();
    } else if (e.key === 'F4') {
      e.preventDefault();
      if (cart.length > 0 && !isProcessing) setShowPayModal(true);
    } else if (e.key === 'F8') {
      e.preventDefault();
      openCashDrawer();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      if (showPayModal) setShowPayModal(false);
      else if (showWeightModal) { setShowWeightModal(null); setWeightInput(''); }
      else if (showReceipt) setShowReceipt(null);
      else if (cart.length > 0) setCart([]);
    }
  };
  window.addEventListener('keydown', handleKeyDown);
  return () => window.removeEventListener('keydown', handleKeyDown);
}, [cart.length, isProcessing, showPayModal, showWeightModal, showReceipt]);

useEffect(() => {
  const cleanup = SyncEngine.setupRealtime(
    (updatedProds) => {
      setProducts(updatedProds.filter(p => p.active !== false));
    },
    (updatedCats) => {
      // Categories updated from other device
    },
    (updatedTxns) => {
      // Transactions updated from other device
    }
  );
  // Pull initial data from Supabase on mount
  SyncEngine.pullFromSupabase();
  return cleanup;
}, []);

function getOrCreateShift(user){
try {
const activeShifts = DB.get('activeShifts',{});
if(activeShifts[user.id] && activeShifts[user.id].status === 'active'){
return activeShifts[user.id];
}
const shifts = DB.get('shifts',[]);
const userShifts = shifts.filter(s=>s.cashierId===user.id);
const shiftNumber = userShifts.length + 1;
const newShift = {
shiftId: 'SHIFT-'+Date.now(), shiftNumber, cashierId: user.id, cashierName: user.name,
startTime: now(), date: today(), status: 'active'
};
activeShifts[user.id] = newShift;
DB.set('activeShifts',activeShifts);
return newShift;
} catch (e) {
console.error('Shift creation error:', e);
return { shiftId: 'SHIFT-'+Date.now(), shiftNumber: 1, cashierId: user.id, cashierName: user.name, startTime: now(), date: today(), status: 'active' };
}
}

const subtotal=cart.reduce((s,i)=>s+i.subtotal,0);
const discAmt=discountType==='percent'?subtotal*(Number(discount)||0)/100:Number(discount)||0;
const total=Math.max(0,subtotal-discAmt);
const change=Number(cashInput||0)-total;

const filteredProducts=useMemo(()=>{
var p=products;
if(catFilter!=='all') p=p.filter(function(pr){ return pr.categoryId===catFilter; });
if(search) {
var q=search.toLowerCase().trim();
p=p.filter(function(pr){ return pr.name.toLowerCase().includes(q)||(pr.sku||'').toLowerCase().includes(q)||(pr.barcode||'').includes(q); });
}
return p;
},[products,catFilter,search]);

const handleAddKgProduct = (product, weight) => {
  const weightNum = Number(weight);
  if (weightNum <= 0) return;
  if (weightNum > (product.stock_kg || 0)) {
    showToast('Insufficient stock!', 'error');
    return;
  }
  const subtotal = weightNum * product.price_per_kg;
  setCart(prev => {
    const ex = prev.find(i => i.id === product.id);
    if (ex) {
      const newWeight = ex.weight_kg + weightNum;
      return prev.map(i => i.id === product.id ? { ...i, weight_kg: newWeight, qty: 1, subtotal: newWeight * i.price_per_kg } : i);
    }
    return [...prev, { ...product, weight_kg: weightNum, qty: 1, unitPrice: product.price_per_kg, price: product.price_per_kg, subtotal }];
  });
  setShowWeightModal(null);
  setWeightInput('');
  showToast(`Added ${weightNum}kg of ${product.name}`, 'success');
};

const addToCart=useCallback((product)=>{
if(!product || (product.unit !== 'kg' && product.stock <= 0)){showToast('Out of stock!','error');return;}
if(product.unit === 'kg') {
  setShowWeightModal(product);
  return;
}
setCart(prev=>{
const ex=prev.find(i=>i.id===product.id);
if(ex){
if(ex.qty>=product.stock){showToast('Insufficient stock','error');return prev;}
return prev.map(i=>i.id===product.id?{...i,qty:i.qty+1,subtotal:(i.qty+1)*i.price}:i);
}
return [...prev,{...product,qty:1,unitPrice:product.price,subtotal:product.price}];
});
},[]);

const updateQty=useCallback((id,qty)=>{
if(qty<=0){setCart(prev=>prev.filter(i=>i.id!==id));return;}
const p=products.find(pr=>pr.id===id);
if(p && p.unit !== 'kg' && qty>p.stock){showToast('Insufficient stock','error');return;}
setCart(prev=>prev.map(i=>i.id===id?{...i,qty,subtotal:qty*i.price}:i));
},[products]);

const checkBarcode=useCallback((code)=>{
if(!code) return;
var cleanCode = code.trim().replace(/[^\u0020-\u007E]/g, '');
if(!cleanCode) return;
var p=products.find(function(pr){ return pr.barcode===cleanCode||pr.sku===cleanCode||(pr.barcode&&pr.barcode.includes(cleanCode))||(pr.sku&&pr.sku.includes(cleanCode)); });
if(p){
  if (p.unit === 'kg') {
    setShowWeightModal(p);
    setBarcodeInput('');
  } else {
    addToCart(p);
    setBarcodeInput('');
    showToast('Scanned: '+p.name,'success');
  }
}
else{
  showToast('Product not found: '+cleanCode,'error');
  setBarcodeInput('');
  setTimeout(() => {
    if (barcodeRef.current) barcodeRef.current.focus();
  }, 500);
}
},[products,addToCart]);

const checkout=useCallback(async ()=>{
if(!cart.length || isProcessing){showToast('Cart is empty or processing','error');return;}
if(payMode==='cash'&&Number(cashInput)<total){showToast('Insufficient cash','error');return;}
setIsProcessing(true);
try {
const activeShifts = DB.get('activeShifts',{});
const currentShift = activeShifts[user.id];
if(!currentShift){showToast('No active shift found. Please login again.','error');setIsProcessing(false);return;}

const txnId = 'TXN' + Date.now() + '_' + uid();
const txn={
id: txnId, shiftId: currentShift.shiftId, shiftNumber: currentShift.shiftNumber,
cashierId:user.id, cashierName:user.name, customerName:customerName||'Walk-in',
items:cart.map(i=>({id:i.id,name:i.name,qty:i.qty,weight_kg:i.weight_kg||null,unitPrice:i.unitPrice,price:i.price,subtotal:i.subtotal})),
subtotal, discount:discAmt, discountInput:discount, discountType,
total, payMode, cashReceived:payMode==='cash'?Number(cashInput):total,
change:payMode==='cash'?change:0, createdAt:now(), date:today(), sync_status: 'pending'
};

const txns=DB.get('transactions',[]);
if(txns.find(t=>t.id===txn.id)){showToast('Transaction already exists','error');setIsProcessing(false);return;}
txns.push(txn); DB.set('transactions',txns);
DB.setAsync('transactions',txns).catch(function(e){ console.warn('IDB sync failed:',e); });

const prods=DB.get('products',[]);
const updatedProds = prods.map(p => {
  const ci = cart.find(i => i.id === p.id);
  if (ci) {
    let newStock = p.stock;
    let newStockKg = p.stock_kg;
    if (p.unit === 'kg') {
      newStockKg = Math.max(0, (p.stock_kg || 0) - ci.weight_kg);
    } else {
      newStock = Math.max(0, (p.stock || 0) - ci.qty);
    }
    return { ...p, stock: newStock, stock_kg: newStockKg };
  }
  return p;
});

const sharedStockMap = {};
cart.forEach(ci => {
  const p = updatedProds.find(prod => prod.id === ci.id);
  if (p && p.unit === 'kg' && p.shared_stock_id) {
    sharedStockMap[p.shared_stock_id] = p.stock_kg;
  }
});

const finalProds = updatedProds.map(p => {
  if (p.shared_stock_id && sharedStockMap[p.shared_stock_id] !== undefined) {
    return { ...p, stock_kg: sharedStockMap[p.shared_stock_id] };
  }
  return p;
});

DB.set('products', finalProds);
setProducts(finalProds.filter(p => p.active !== false));
DB.setAsync('products', finalProds).catch(function(e){ console.warn('IDB sync failed:',e); });

if (navigator.onLine && supabaseClient) {
  DB.queueOffline('transaction', txn);
}

const shiftTxns = txns.filter(t=>t.shiftId===currentShift.shiftId);
currentShift.totalSales = shiftTxns.reduce((s,t)=>s+t.total,0);
currentShift.totalTransactions = shiftTxns.length;
currentShift.cashSales = shiftTxns.filter(t=>t.payMode==='cash').reduce((s,t)=>s+t.total,0);
currentShift.gcashSales = shiftTxns.filter(t=>t.payMode==='gcash').reduce((s,t)=>s+t.total,0);
currentShift.cardSales = shiftTxns.filter(t=>t.payMode==='card').reduce((s,t)=>s+t.total,0);
activeShifts[user.id] = currentShift;
DB.set('activeShifts',activeShifts);

DB.createBackup();

if (payMode === 'cash') {
  openCashDrawer();
}

try {
  PrintEngine.printReceipt(txn, settings);
} catch (e) { console.warn('Auto-print failed:', e); }

setShowReceipt(txn);
setCart([]);setCashInput('');setDiscount('');setCustomerName('');setPayMode('cash');
showToast('Transaction complete!','success');
setShowPayModal(false);
} catch (e) {
console.error('Checkout error:', e);
showToast('Checkout failed. Please try again.','error');
} finally {
setIsProcessing(false);
}
},[cart,payMode,cashInput,total,change,user,discAmt,discount,discountType,customerName,isProcessing]);

const cats=[{id:'all',name:'All',color:'#4f8ef7'},...categories];
return(
<div style={{display:'flex',height:'calc(100vh - 0px)',overflow:'hidden'}} className="pos-layout">
<div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',padding:'16px',gap:12}} className="pos-products">
<div style={{display:'flex',gap:10,alignItems:'center'}}>
<div className="search-box" style={{flex:1}}>
{Icon.search}
<input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search products..." style={{width:'100%'}}/>
</div>
<div style={{position:'relative'}}>
<input ref={barcodeRef} value={barcodeInput} onChange={e=>setBarcodeInput(e.target.value)}
onKeyDown={e=>e.key==='Enter'&&checkBarcode(barcodeInput)}
placeholder="Scan barcode (F2)..." style={{width:180}}/>
</div>
</div>
<div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
{cats.map(c=>(
<button key={c.id} className={`chip${catFilter===c.id?' active':''}`} onClick={()=>setCatFilter(c.id)}>{c.name}</button>
))}
</div>
<div className="product-grid" style={{flex:1,overflowY:'auto',display:'grid',gap:10,alignContent:'start'}}>
{filteredProducts.map(p=>(
<div key={p.id} className="pos-key" onClick={()=>addToCart(p)} style={{position:'relative',textAlign:'left',padding:12}}>
{(p.unit !== 'kg' && Number(p.stock||0)<=Number(p.lowStockAlert||0)) && <span className="badge badge-yellow" style={{position:'absolute',top:6,right:6,fontSize:9}}>LOW</span>}
{(p.unit !== 'kg' && p.stock<=0) && <span className="badge badge-red" style={{position:'absolute',top:6,right:6,fontSize:9}}>OUT</span>}
{(p.unit === 'kg' && Number(p.stock_kg||0)<=Number(p.lowStockAlert||0)) && <span className="badge badge-yellow" style={{position:'absolute',top:6,right:6,fontSize:9}}>LOW</span>}
{(p.unit === 'kg' && Number(p.stock_kg||0)<=0) && <span className="badge badge-red" style={{position:'absolute',top:6,right:6,fontSize:9}}>OUT</span>}
<div style={{fontSize:11,color:'var(--text3)',marginBottom:2}}>{categories.find(c=>c.id===p.categoryId)?.name||''} {p.variant?`(${p.variant})`:''}</div>
<div style={{fontSize:13,fontWeight:600,lineHeight:1.3,marginBottom:6}}>{p.name}</div>
<div style={{fontSize:15,fontWeight:700,color:'var(--accent)',fontFamily:'var(--mono)'}}>
  {p.unit === 'kg' ? `${fmtCur(p.price_per_kg)}/kg` : fmtCur(p.price)}
</div>
<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>
  {p.unit === 'kg' ? `Stock: ${p.stock_kg}kg` : `Stock: ${p.stock}`}
</div>
</div>
))}
{filteredProducts.length===0&&<div style={{gridColumn:'1/-1',textAlign:'center',padding:'40px 20px',color:'var(--text3)'}}>No products found</div>}
</div>
</div>
<div className="pos-cart" style={{width:340,background:'var(--bg2)',borderLeft:'1px solid var(--border)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
<div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',fontWeight:600,fontSize:15,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
<span>Order Cart</span>
<div style={{display:'flex',gap:8}}>
  <button className="btn btn-ghost btn-sm" onClick={openCashDrawer} title="Open Cash Drawer (F8)">{Icon.cash}</button>
  {cart.length>0&&<button className="btn btn-ghost btn-sm" onClick={()=>setCart([])}>Clear</button>}
</div>
</div>
<div style={{flex:1,overflowY:'auto',padding:'8px 12px'}}>
{cart.length===0?<div style={{textAlign:'center',padding:'40px 20px',color:'var(--text3)',fontSize:13}}>Cart is empty.<br/>Click products to add.</div>:
cart.map(item=>(
<div key={item.id} style={{padding:'10px 8px',borderBottom:'1px solid var(--border)',display:'flex',gap:8,alignItems:'center'}}>
<div style={{flex:1,minWidth:0}}>
<div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
{item.unit !== 'kg' && <input type="number" value={item.price} onChange={e=>{
  const newPrice = Number(e.target.value)||0;

}} style={{width:'100%',marginTop:4,padding:'3px 7px',fontSize:12}}/>}

{item.unit !== 'kg' && <>

</div>
<div style={{display:'flex',gap:8,marginBottom:10}}>
<div style={{flex:1}}>
<label>Discount</label>
<input type="number" value={discount} onChange={e=>setDiscount(e.target.value)} placeholder="0" style={{width:'100%'}}/>
</div>
<div style={{width:90}}>
<label>Type</label>
<select value={discountType} onChange={e=>setDiscountType(e.target.value)} style={{width:'100%'}}>
<option value="percent">%</option>
<option value="fixed">₱</option>
</select>
</div>
</div>
<div className="divider"/>
<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--text2)',marginBottom:4}}>
<span>Subtotal</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(subtotal)}</span>
</div>
{discAmt>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,color:'var(--green)',marginBottom:4}}>
<span>Discount</span><span style={{fontFamily:'var(--mono)'}}>-{fmtCur(discAmt)}</span>
</div>}
<div style={{display:'flex',justifyContent:'space-between',fontSize:18,fontWeight:700,marginBottom:14}}>
<span>TOTAL</span><span style={{fontFamily:'var(--mono)',color:'var(--accent)'}}>{fmtCur(total)}</span>
</div>
<div style={{display:'flex',gap:8,marginBottom:10}}>
{['cash','gcash','card'].map(m=>(
<button key={m} className={`btn btn-sm ${payMode===m?'btn-primary':'btn-ghost'}`} style={{flex:1,textTransform:'capitalize'}} onClick={()=>setPayMode(m)}>{m}</button>
))}
</div>
{payMode==='cash'&&(
<div style={{marginBottom:10}}>
<label>Cash Received</label>
<input type="number" value={cashInput} onChange={e=>setCashInput(e.target.value)} placeholder="0.00" style={{width:'100%',fontSize:15}}/>
{cashInput&&<div style={{fontSize:12,marginTop:4,color:change>=0?'var(--green)':'var(--red)'}}>Change: {fmtCur(change)}</div>}
</div>
)}
<button className="btn btn-success" style={{width:'100%',padding:'13px',fontSize:15,fontWeight:700}} onClick={()=>cart.length&&setShowPayModal(true)} disabled={!cart.length || isProcessing}>
{isProcessing ? <span className="spinner"/> : `✓ Checkout ${cart.length>0?`(${fmtCur(total)})`:''}`}
</button>
</div>
</div>

{showWeightModal && (
  <div className="modal-overlay">
    <div className="modal" style={{maxWidth: 400}}>
      <h3 style={{marginBottom: 16}}>{showWeightModal.name} {showWeightModal.variant ? `(${showWeightModal.variant})` : ''}</h3>
      <div style={{textAlign: 'center', fontSize: 28, fontWeight: 700, color: 'var(--accent)', marginBottom: 20, fontFamily: 'var(--mono)'}}>
        {fmtCur((Number(weightInput) || 0) * showWeightModal.price_per_kg)}
      </div>
      <input 
        type="number" 
        step="0.01"
        value={weightInput} 
        onChange={e => setWeightInput(e.target.value)} 
        placeholder="Weight in kg" 
        style={{width: '100%', fontSize: 24, textAlign: 'center', padding: 12, marginBottom: 20}}
        autoFocus
      />
      <div style={{display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10, marginBottom: 20}}>
        {[0.25, 0.5, 1, 2].map(w => (
          <button key={w} className="btn btn-primary" style={{height: 48, fontSize: 18}} onClick={() => setWeightInput(w)}>{w} kg</button>
        ))}
      </div>
      <div style={{display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10, marginBottom: 20}}>
        {[
          {label: '7', value: '7'}, {label: '8', value: '8'}, {label: '9', value: '9'}, {label: '⌫', value: 'backspace'},
          {label: '4', value: '4'}, {label: '5', value: '5'}, {label: '6', value: '6'}, {label: 'Clear', value: 'clear'},
          {label: '1', value: '1'}, {label: '2', value: '2'}, {label: '3', value: '3'}, {label: '.', value: 'dot'},
          {label: '0', value: '0'}, {label: '00', value: '00'}, {label: '', value: 'empty'}
        ].map((btn) => {
          if (btn.value === 'empty') return <div key="empty-slot"></div>;
          return (
            <button key={btn.value} className="numpad-btn" onClick={() => {
              if (btn.value === 'backspace') {
                setWeightInput(prev => String(prev || '').slice(0, -1));
              } else if (btn.value === 'clear') {
                setWeightInput('');
              } else if (btn.value === 'dot') {
                setWeightInput(prev => {
                  const current = String(prev || '');
                  if (current.indexOf('.') === -1) return current + '.';
                  return current;
                });
              } else {
                setWeightInput(prev => String(prev || '') + btn.value);
              }
            }}>{btn.label}</button>
          );
        })}
      </div>
      <div style={{display: 'flex', gap: 10}}>
        <button className="btn btn-ghost" style={{flex: 1, height: 48}} onClick={() => { setShowWeightModal(null); setWeightInput(''); }}>Cancel (ESC)</button>
        <button className="btn btn-success" style={{flex: 1, height: 48}} onClick={() => {
          const w = Number(weightInput);
          if (w > 0) {
            handleAddKgProduct(showWeightModal, w);
          } else {
            showToast('Please enter a valid weight', 'error');
            setTimeout(() => { if(barcodeRef.current) barcodeRef.current.focus(); }, 500);
          }
        }}>Add to Cart</button>
      </div>
    </div>
  </div>
)}

{showPayModal&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:380}}>
<h3 style={{marginBottom:16}}>Confirm Payment</h3>
<div style={{background:'var(--bg3)',borderRadius:'var(--radius)',padding:14,marginBottom:16}}>
{cart.map(i=><div key={i.id} style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}}>
<span>{i.name} {i.weight_kg ? `(${i.weight_kg}kg)` : `x${i.qty}`}</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(i.subtotal)}</span>
</div>)}
<div className="divider"/>
<div style={{display:'flex',justifyContent:'space-between',fontWeight:700}}>
<span>Total</span><span style={{fontFamily:'var(--mono)',color:'var(--accent)'}}>{fmtCur(total)}</span>
</div>
{payMode==='cash'&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginTop:4,color:'var(--green)'}}>
<span>Change</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(change)}</span>
</div>}
</div>
<div style={{display:'flex',gap:10}}>
<button className="btn btn-ghost" style={{flex:1}} onClick={()=>setShowPayModal(false)}>Back</button>
<button className="btn btn-success" style={{flex:1}} onClick={checkout}>Confirm & Pay</button>
</div>
</div>
</div>
)}

{showReceipt&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:380}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
<h3>Receipt</h3>
<div style={{display:'flex',gap:8}}>
<button className="btn btn-ghost btn-sm" onClick={()=>{setTimeout(()=>window.print(),100);}}>{Icon.print} Print</button>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowReceipt(null)}>Close</button>
</div>
</div>
<div className="receipt receipt-wrapper">
<div style={{textAlign:'center',marginBottom:8}}>
<div style={{fontWeight:700,fontSize:14}}>{settings.storeName||'Branch'} POS</div>
<div style={{fontSize:11}}>{settings.storeAddress}</div>
<div style={{fontSize:11}}>{settings.storeTel}</div>
</div>
<hr/>
<div style={{display:'flex',justifyContent:'space-between',fontSize:11}}>
<span>TXN#: {showReceipt.id}</span><span>{fmtDateTime(showReceipt.createdAt)}</span>
</div>
<div style={{fontSize:11}}>Shift: {showReceipt.shiftNumber}</div>
<div style={{fontSize:11}}>Cashier: {showReceipt.cashierName}</div>
{showReceipt.customerName!=='Walk-in'&&<div style={{fontSize:11}}>Customer: {showReceipt.customerName}</div>}
<hr/>
{showReceipt.items.map((i,x)=>(
<div key={x} style={{display:'flex',justifyContent:'space-between',fontSize:11,marginBottom:2}}>
<span>{i.name}<br/>&nbsp;{i.weight_kg ? i.weight_kg+'kg' : i.qty+' x '+fmtCur(i.price)}</span>
<span>{fmtCur(i.subtotal)}</span>
</div>
))}
<hr/>
<div style={{display:'flex',justifyContent:'space-between',fontSize:11}}><span>Subtotal</span><span>{fmtCur(showReceipt.subtotal)}</span></div>
{showReceipt.discount>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:11}}><span>Discount</span><span>-{fmtCur(showReceipt.discount)}</span></div>}
<div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:12}}><span>TOTAL</span><span>{fmtCur(showReceipt.total)}</span></div>
<div style={{display:'flex',justifyContent:'space-between',fontSize:11}}><span>Payment ({showReceipt.payMode.toUpperCase()})</span><span>{fmtCur(showReceipt.cashReceived)}</span></div>
{showReceipt.change>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:11}}><span>Change</span><span>{fmtCur(showReceipt.change)}</span></div>}
<hr/>
<div style={{textAlign:'center',fontSize:11}}>{settings.receiptFooter||'Thank you!'}</div>
</div>
</div>
</div>
)}
</div>
);
};

const ProductsPage=({user})=>{
const [products,setProducts]=useState(()=>DB.get('products',[]));
const [categories,setCategories]=useState(()=>DB.get('categories',[]));
const [search,setSearch]=useState('');
const [catFilter,setCatFilter]=useState('all');
const [showModal,setShowModal]=useState(false);
const [editing,setEditing]=useState(null);
const [showCatModal,setShowCatModal]=useState(false);
const [confirm,setConfirm]=useState(null);
const imgRef=useRef();
const empty={name:'',sku:'',categoryId:'',unit:'pcs',price:'',price_per_kg:'',cost:'',stock:'',stock_kg:'',variant:'',shared_stock_id:'',lowStockAlert:'10',barcode:'',image:null,active:true};
const [form,setForm]=useState(empty);

const save=useCallback(function(){
const isKg = form.unit === 'kg';
if(!form.name || (!isKg && !form.price) || (isKg && !form.price_per_kg)){showToast('Name and price required','error');return;}
try {
var prods=DB.get('products',[]);
var updated;
if(editing){
updated=prods.map(function(p){ return p.id===editing?{...p,...form,price:Number(form.price)||0,price_per_kg:parseFloat(form.price_per_kg)||0,cost:Number(form.cost)||0,stock:parseInt(form.stock)||0,stock_kg:parseFloat(form.stock_kg)||0,lowStockAlert:Number(form.lowStockAlert)||10,updatedAt:now()}:p; });
DB.set('products',updated);setProducts(updated);
if(navigator.onLine && supabaseClient) {
  DB.queueOffline('product_update', updated.find(p=>p.id===editing));
}
}else{
var np={...form,id:uid(),sku:form.sku||'SKU'+Date.now(),price:Number(form.price)||0,price_per_kg:parseFloat(form.price_per_kg)||0,cost:Number(form.cost)||0,stock:parseInt(form.stock)||0,stock_kg:parseFloat(form.stock_kg)||0,lowStockAlert:Number(form.lowStockAlert)||10,createdAt:now()};
updated=[...prods,np];DB.set('products',updated);setProducts(updated);
if(navigator.onLine && supabaseClient) {
  DB.queueOffline('product_update', np);
}
}
DB.createBackup();
showToast(editing?'Product updated':'Product added','success');
setShowModal(false);setEditing(null);setForm(empty);
} catch (e) { showToast('Save failed','error'); console.error(e); }
},[form,editing,empty]);

const del=useCallback((id)=>{
try {
const updated=products.map(p=>p.id===id?{...p,active:false}:p);
DB.set('products',updated);setProducts(updated);showToast('Product deactivated','info');
DB.createBackup();
} catch (e) { showToast('Delete failed','error'); }
},[products]);

const handleImg=useCallback((e)=>{
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=ev=>setForm(pr=>({...pr,image:ev.target.result}));
r.readAsDataURL(f);
},[]);

const filtered=useMemo(()=>{
let p=products.filter(pr=>pr.active!==false);
if(catFilter!=='all')p=p.filter(pr=>pr.categoryId===catFilter);
if(search)p=p.filter(pr=>pr.name.toLowerCase().includes(search.toLowerCase())||pr.sku?.includes(search));
return p;
},[products,catFilter,search]);

const openEdit=useCallback((p)=>{setForm({...p,price:String(p.price),price_per_kg:String(p.price_per_kg||''),cost:String(p.cost),stock:String(p.stock),stock_kg:String(p.stock_kg||''),lowStockAlert:String(p.lowStockAlert||10)});setEditing(p.id);setShowModal(true);},[]);

const [catForm,setCatForm]=useState({name:'',color:'#4f8ef7'});
const saveCat=useCallback(()=>{
if(!catForm.name)return;
try {
const cats=[...categories,{id:uid(),...catForm}];
DB.set('categories',cats);setCategories(cats);setCatForm({name:'',color:'#4f8ef7'});showToast('Category added','success');
DB.createBackup();
} catch (e) { showToast('Failed to add category','error'); }
},[catForm,categories]);

const delCat=useCallback((id)=>{ const cats=categories.filter(c=>c.id!==id);DB.set('categories',cats);setCategories(cats); },[categories]);

return(
<div style={{padding:'20px',flex:1,overflow:'auto'}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<div>
<h2 style={{fontSize:20,fontWeight:700}}>Products</h2>
<p style={{color:'var(--text3)',fontSize:13}}>{products.filter(p=>p.active!==false).length} active products</p>
</div>
<div style={{display:'flex',gap:10}}>
{user.role==='admin'&&<button className="btn btn-ghost btn-sm" onClick={()=>setShowCatModal(true)}>{Icon.category} Categories</button>}
<button className="btn btn-primary btn-sm" onClick={()=>{setForm(empty);setEditing(null);setShowModal(true);}}>+ Add Product</button>
</div>
</div>
<div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>
<div className="search-box" style={{width:260}}>{Icon.search}<input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search products..."/></div>
{[{id:'all',name:'All'},...categories].map(c=>(
<button key={c.id} className={`chip${catFilter===c.id?' active':''}`} onClick={()=>setCatFilter(c.id)}>{c.name}</button>
))}
</div>
<div className="card" style={{padding:0,overflow:'hidden'}}>
<table>
<thead><tr><th>Product</th><th>SKU / Barcode</th><th>Category</th><th>Unit</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
<tbody>
{filtered.map(p=>(
<tr key={p.id}>
<td><div style={{display:'flex',alignItems:'center',gap:10}}>
{p.image?<img src={p.image} alt="" className="product-img"/>:<div className="img-placeholder">{Icon.img}</div>}
<div><div style={{fontWeight:500}}>{p.name} {p.variant?`(${p.variant})`:''}</div></div>
</div></td>
<td><div style={{fontFamily:'var(--mono)',fontSize:12}}>{p.sku}</div><div style={{fontSize:11,color:'var(--text3)'}}>{p.barcode||'—'}</div></td>
<td>{categories.find(c=>c.id===p.categoryId)?.name||'—'}</td>
<td><span className="badge badge-blue">{p.unit}</span></td>
<td style={{fontFamily:'var(--mono)',fontWeight:600,color:'var(--accent)'}}>{p.unit==='kg'?fmtCur(p.price_per_kg)+'/kg':fmtCur(p.price)}</td>
<td><span className={`badge ${p.unit==='kg'?(Number(p.stock_kg||0)<=0?'badge-red':Number(p.stock_kg||0)<=Number(p.lowStockAlert||0)?'badge-yellow':'badge-green'):(Number(p.stock||0)<=0?'badge-red':Number(p.stock||0)<=Number(p.lowStockAlert||0)?'badge-yellow':'badge-green')}`}>
  {p.unit==='kg'?p.stock_kg+'kg':p.stock}
</span></td>
<td><span className="badge badge-green">Active</span></td>
<td><div style={{display:'flex',gap:6}}>
<button className="btn btn-ghost btn-sm" style={{padding:'5px 8px'}} onClick={()=>openEdit(p)}>{Icon.edit}</button>
{user.role==='admin'&&<button className="btn btn-ghost btn-sm" style={{padding:'5px 8px',color:'var(--red)'}} onClick={()=>setConfirm({msg:`Deactivate "${p.name}"?`,cb:()=>del(p.id)})}>{Icon.trash}</button>}
</div></td>
</tr>
))}
{filtered.length===0&&<tr><td colSpan={8} style={{textAlign:'center',padding:'30px',color:'var(--text3)'}}>No products found</td></tr>}
</tbody>
</table>
</div>

{showModal&&(
<div className="modal-overlay">
<div className="modal modal-lg">
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<h3>{editing?'Edit Product':'Add Product'}</h3>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowModal(false)}>✕</button>
</div>
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
<div>
<div className="form-row"><label>Product Name *</label><input value={form.name} onChange={e=>setForm(p=>({...p,name:e.target.value}))} style={{width:'100%'}}/></div>
<div className="form-row cols2"><div><label>SKU</label><input value={form.sku} onChange={e=>setForm(p=>({...p,sku:e.target.value}))} style={{width:'100%'}}/></div>
<div><label>Barcode</label><input value={form.barcode} onChange={e=>setForm(p=>({...p,barcode:e.target.value}))} style={{width:'100%'}}/></div></div>
<div className="form-row cols2">
<div><label>Category</label>
<select value={form.categoryId} onChange={e=>setForm(p=>({...p,categoryId:e.target.value}))} style={{width:'100%'}}>
<option value="">Select category</option>
{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
</select>
</div>
<div><label>Unit</label>
<select value={form.unit} onChange={e=>setForm(p=>({...p,unit:e.target.value}))} style={{width:'100%'}}>
<option value="pcs">Pieces (pcs)</option>
<option value="kg">Kilogram (kg)</option>
</select>
</div>
</div>
{form.unit === 'kg' && (
<>
<div className="form-row cols2">
<div><label>Price per Kg *</label><input type="number" value={form.price_per_kg} onChange={e=>setForm(p=>({...p,price_per_kg:e.target.value}))} style={{width:'100%'}}/></div>
<div><label>Variant (e.g., Whole, Cut)</label><input value={form.variant} onChange={e=>setForm(p=>({...p,variant:e.target.value}))} style={{width:'100%'}}/></div>
</div>
<div className="form-row cols2">
<div><label>Stock (Kg)</label><input type="number" step="0.01" value={form.stock_kg} onChange={e=>setForm(p=>({...p,stock_kg:e.target.value}))} style={{width:'100%'}}/></div>
<div><label>Shared Stock ID (Optional)</label><input value={form.shared_stock_id} onChange={e=>setForm(p=>({...p,shared_stock_id:e.target.value}))} placeholder="Link variants" style={{width:'100%'}}/></div>
</div>
</>
)}
{form.unit === 'pcs' && (
<div className="form-row cols2">
<div><label>Selling Price *</label><input type="number" value={form.price} onChange={e=>setForm(p=>({...p,price:e.target.value}))} style={{width:'100%'}}/></div>
<div><label>Cost Price</label><input type="number" value={form.cost} onChange={e=>setForm(p=>({...p,cost:e.target.value}))} style={{width:'100%'}}/></div>
</div>
)}
<div className="form-row"><label>Low Stock Alert</label><input type="number" value={form.lowStockAlert} onChange={e=>setForm(p=>({...p,lowStockAlert:e.target.value}))} style={{width:'100%'}}/></div>
</div>
<div style={{display:'flex',flexDirection:'column',gap:14}}>
<div>
<label>Product Image</label>
<div style={{border:'2px dashed var(--border)',borderRadius:'var(--radius2)',padding:20,textAlign:'center',cursor:'pointer'}} onClick={()=>imgRef.current.click()}>
{form.image?<img src={form.image} alt="" style={{maxWidth:'100%',maxHeight:140,borderRadius:'var(--radius)',objectFit:'contain'}}/>:
<div style={{color:'var(--text3)'}}>{Icon.img}<div style={{marginTop:8,fontSize:13}}>Click to upload image</div></div>}
</div>
<input type="file" accept="image/*" ref={imgRef} style={{display:'none'}} onChange={handleImg}/>
{form.image&&<button className="btn btn-ghost btn-sm" style={{marginTop:8,width:'100%'}} onClick={()=>setForm(p=>({...p,image:null}))}>Remove Image</button>}
</div>
<div>
<label>Active</label>
<label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',marginTop:6}}>
<input type="checkbox" checked={form.active!==false} onChange={e=>setForm(p=>({...p,active:e.target.checked}))} style={{width:'auto'}}/>
<span style={{fontSize:13}}>Product is active and visible in POS</span>
</label>
</div>
</div>
</div>
<div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:20}}>
<button className="btn btn-ghost" onClick={()=>setShowModal(false)}>Cancel</button>
<button className="btn btn-primary" onClick={save}>{editing?'Save Changes':'Add Product'}</button>
</div>
</div>
</div>
)}

{showCatModal&&(
<div className="modal-overlay">
<div className="modal">
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
<h3>Manage Categories</h3>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowCatModal(false)}>✕</button>
</div>
<div style={{display:'flex',gap:10,marginBottom:14}}>
<input value={catForm.name} onChange={e=>setCatForm(p=>({...p,name:e.target.value}))} placeholder="Category name" style={{flex:1}}/>
<input type="color" value={catForm.color} onChange={e=>setCatForm(p=>({...p,color:e.target.value}))} style={{width:44,padding:'2px 4px',cursor:'pointer'}}/>
<button className="btn btn-primary btn-sm" onClick={saveCat}>Add</button>
</div>
<div style={{display:'flex',flexDirection:'column',gap:6}}>
{categories.map(c=>(
<div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'var(--bg3)',borderRadius:'var(--radius)'}}>
<div style={{width:14,height:14,borderRadius:'50%',background:c.color,flexShrink:0}}/>
<span style={{flex:1,fontSize:14}}>{c.name}</span>
<button className="btn btn-ghost btn-sm" style={{color:'var(--red)',padding:'3px 8px'}} onClick={()=>delCat(c.id)}>{Icon.trash}</button>
</div>
))}
</div>
</div>
</div>
)}
{confirm&&<ConfirmModal msg={confirm.msg} onYes={()=>{confirm.cb();setConfirm(null);}} onNo={()=>setConfirm(null)}/>}
</div>
);
};

const InventoryPage=({user})=>{
const [products,setProducts]=useState(()=>DB.get('products',[]));
const [restocks,setRestocks]=useState(()=>DB.get('restocks',[]));
const [showModal,setShowModal]=useState(false);
const [form,setForm]=useState({productId:'',qty:'',supplier:'',notes:'',cost:''});
const [tab,setTab]=useState('stock');
const [search,setSearch]=useState('');
const categories=DB.get('categories',[]);
const lowStock=products.filter(p=>p.active!==false&&Number(p.unit==='kg'?(p.stock_kg||0):(p.stock||0))<=Number(p.lowStockAlert||0));

const addRestock=useCallback(function(){
if(!form.productId||!form.qty){showToast('Select product and quantity','error');return;}
try {
var rec={id:uid(),...form,qty:Number(form.qty),cost:Number(form.cost||0),addedBy:user.name,createdAt:now()};
var updRest=[...restocks,rec];DB.set('restocks',updRest);setRestocks(updRest);

var prods=DB.get('products',[]);
var target = prods.find(p => p.id === form.productId);
var upd;
if (target && target.unit === 'kg') {
  const newStockKg = Number(target.stock_kg || 0) + Number(form.qty || 0);
  if (target.shared_stock_id) {
    upd = prods.map(p => p.shared_stock_id === target.shared_stock_id ? {...p, stock_kg: newStockKg} : p);
  } else {
    upd = prods.map(p => p.id === form.productId ? {...p, stock_kg: newStockKg} : p);
  }
} else {
  upd = prods.map(p => p.id === form.productId ? {...p, stock: Number(p.stock || 0) + Number(form.qty || 0)} : p);
}

DB.set('products',upd);setProducts(upd);
setForm({productId:'',qty:'',supplier:'',notes:'',cost:''});
setShowModal(false);showToast('Stock updated successfully','success');
DB.createBackup();
} catch (e) { showToast('Restock failed','error'); }
},[form,user,restocks]);

const filtered=products.filter(p=>p.active!==false&&(search?p.name.toLowerCase().includes(search.toLowerCase()):true));

return(
<div style={{padding:'20px',flex:1,overflow:'auto'}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<div>
<h2 style={{fontSize:20,fontWeight:700}}>Inventory</h2>
<p style={{color:'var(--text3)',fontSize:13}}>Real-time stock monitoring</p>
</div>
<button className="btn btn-primary btn-sm" onClick={()=>setShowModal(true)}>+ Receive Stock</button>
</div>
{lowStock.length>0&&(
<div className="alert alert-warn" style={{marginBottom:16,display:'flex',alignItems:'center',gap:10}}>
<span style={{width:18,height:18,flexShrink:0}}>{Icon.alert}</span>
<span><b>{lowStock.length} product(s)</b> below low stock threshold: {lowStock.map(p=>p.name).join(', ')}</span>
</div>
)}
<div style={{display:'flex',gap:10,marginBottom:16}}>
<button className={`chip${tab==='stock'?' active':''}`} onClick={()=>setTab('stock')}>Stock Levels</button>
<button className={`chip${tab==='history'?' active':''}`} onClick={()=>setTab('history')}>Restock History</button>
</div>
{tab==='stock'&&(
<>
<div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:16}}>
<div className="stat-card"><div className="stat-val">{products.filter(p=>p.active!==false).length}</div><div className="stat-label">Total Products</div></div>
<div className="stat-card"><div className="stat-val" style={{color:'var(--red)'}}>{lowStock.length}</div><div className="stat-label">Low Stock</div></div>
<div className="stat-card"><div className="stat-val">{products.filter(p=>(p.unit==='kg'?p.stock_kg:p.stock)<=0&&p.active!==false).length}</div><div className="stat-label">Out of Stock</div></div>
<div className="stat-card"><div className="stat-val" style={{color:'var(--green)'}}>{products.filter(p=>Number(p.unit==='kg'?(p.stock_kg||0):(p.stock||0))>Number(p.lowStockAlert||0)&&p.active!==false).length}</div><div className="stat-label">Well Stocked</div></div>
</div>
<div className="search-box" style={{marginBottom:12,width:260}}>{Icon.search}<input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search product..."/></div>
<div className="card" style={{padding:0,overflow:'hidden'}}>
<table>
<thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Low Alert</th><th>Status</th></tr></thead>
<tbody>{filtered.map(p=>(
<tr key={p.id}>
<td><div style={{fontWeight:500}}>{p.name} {p.variant?`(${p.variant})`:''}</div><div style={{fontSize:11,color:'var(--text3)',fontFamily:'var(--mono)'}}>{p.sku}</div></td>
<td>{categories.find(c=>c.id===p.categoryId)?.name||'—'}</td>
<td><span style={{fontFamily:'var(--mono)',fontWeight:700,fontSize:16}}>{p.unit==='kg'?p.stock_kg+'kg':p.stock}</span></td>
<td style={{color:'var(--text2)',fontFamily:'var(--mono)'}}>{p.lowStockAlert}{p.unit==='kg'?'kg':''}</td>
<td><span className={`badge ${(p.unit==='kg'?Number(p.stock_kg||0):Number(p.stock||0))<=0?'badge-red':(p.unit==='kg'?Number(p.stock_kg||0):Number(p.stock||0))<=Number(p.lowStockAlert||0)?'badge-yellow':'badge-green'}`}>
{(p.unit==='kg'?Number(p.stock_kg||0):Number(p.stock||0))<=0?'Out of Stock':(p.unit==='kg'?Number(p.stock_kg||0):Number(p.stock||0))<=Number(p.lowStockAlert||0)?'Low Stock':'In Stock'}
</span></td>
</tr>
))}</tbody>
</table>
</div>
</>
)}
{tab==='history'&&(
<div className="card" style={{padding:0,overflow:'hidden'}}>
<table>
<thead><tr><th>Date</th><th>Product</th><th>Qty Added</th><th>Supplier</th><th>Cost</th><th>Notes</th><th>By</th></tr></thead>
<tbody>
{[...restocks].reverse().map(r=>(
<tr key={r.id}>
<td style={{fontSize:12}}>{fmtDateTime(r.createdAt)}</td>
<td>{products.find(p=>p.id===r.productId)?.name||'Unknown'}</td>
<td><span className="badge badge-green">+{r.qty}{products.find(p=>p.id===r.productId)?.unit==='kg'?'kg':''}</span></td>
<td style={{color:'var(--text2)',fontSize:13}}>{r.supplier||'—'}</td>
<td style={{fontFamily:'var(--mono)',fontSize:12}}>{r.cost?fmtCur(r.cost):'—'}</td>
<td style={{color:'var(--text2)',fontSize:12}}>{r.notes||'—'}</td>
<td style={{fontSize:12}}>{r.addedBy}</td>
</tr>
))}
{restocks.length===0&&<tr><td colSpan={7} style={{textAlign:'center',padding:'30px',color:'var(--text3)'}}>No restock records yet</td></tr>}
</tbody>
</table>
</div>
)}
{showModal&&(
<div className="modal-overlay">
<div className="modal">
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
<h3>Receive Stock</h3>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowModal(false)}>✕</button>
</div>
<div className="form-row"><label>Product *</label>
<select value={form.productId} onChange={e=>setForm(p=>({...p,productId:e.target.value}))} style={{width:'100%'}}>
<option value="">Select product</option>
{products.filter(p=>p.active!==false).map(p=><option key={p.id} value={p.id}>{p.name} (Stock: {p.unit==='kg'?p.stock_kg+'kg':p.stock})</option>)}
</select>
</div>
<div className="form-row cols2">
<div><label>Quantity to Add *</label><input type="number" step={form.productId&&products.find(x=>x.id===form.productId)?.unit==='kg'?"0.01":"1"} value={form.qty} onChange={e=>setForm(p=>({...p,qty:e.target.value}))} style={{width:'100%'}}/></div>
<div><label>Unit Cost</label><input type="number" value={form.cost} onChange={e=>setForm(p=>({...p,cost:e.target.value}))} style={{width:'100%'}}/></div>
</div>
<div className="form-row"><label>Supplier</label><input value={form.supplier} onChange={e=>setForm(p=>({...p,supplier:e.target.value}))} style={{width:'100%'}}/></div>
<div className="form-row"><label>Notes</label><textarea value={form.notes} onChange={e=>setForm(p=>({...p,notes:e.target.value}))} style={{width:'100%',height:70,resize:'vertical'}}/></div>
<div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
<button className="btn btn-ghost" onClick={()=>setShowModal(false)}>Cancel</button>
<button className="btn btn-success" onClick={addRestock}>Add Stock</button>
</div>
</div>
</div>
)}
</div>
);
};

const SalesPage=({user})=>{
const [,forceUpdate]=useReducer(x=>x+1,0);
const transactions = DB.get('transactions',[]);
const [dateFilter,setDateFilter]=useState(today());
const [showShiftModal,setShowShiftModal]=useState(false);
const [cashOnHand,setCashOnHand]=useState('');
const [cashFund,setCashFund]=useState('');
const [selectedTxn,setSelectedTxn]=useState(null);
const [reprintTxn,setReprintTxn]=useState(null);
const [showPrintReport,setShowPrintReport]=useState(false);
const [endedShiftData,setEndedShiftData]=useState(null);
const settings=DB.get('settings',{});

const activeShift = useMemo(()=>{
const activeShifts = DB.get('activeShifts',{});
return activeShifts[user.id] || null;
},[user.id,transactions.length,dateFilter,showShiftModal]);

const filtered = useMemo(()=>{
if(!activeShift) return [];
let txns = transactions.filter(t=>t.shiftId === activeShift.shiftId && t.cashierId === user.id);
return txns.reverse();
},[transactions,activeShift,user.id]);

const totalSales=filtered.reduce((s,t)=>s+t.total,0);
const cashSales=filtered.filter(t=>t.payMode==='cash').reduce((s,t)=>s+t.total,0);
const gcashSales=filtered.filter(t=>t.payMode==='gcash').reduce((s,t)=>s+t.total,0);
const cardSales=filtered.filter(t=>t.payMode==='card').reduce((s,t)=>s+t.total,0);
const totalTransactions=filtered.length;
const expenses=DB.get('expenses',[]).filter(e=>e.date===dateFilter && e.encodedBy === user.name).reduce((s,e)=>s+Number(e.amount),0);
const net=totalSales-expenses;

const endShift=useCallback(()=>{
if(!activeShift){showToast('No active shift found','error');return;}
try {
const coh=Number(cashOnHand)||0;
const cf=Number(cashFund)||0;
const expected=Number(cashSales||0)+Number(cf||0)-Number(expenses||0);
const diff=coh-expected;
const endTime = now();
const shiftData={
shiftId: activeShift.shiftId, shiftNumber: activeShift.shiftNumber, cashierId:user.id, cashierName:user.name,
date:dateFilter, startTime: activeShift.startTime, endTime: endTime, totalSales, totalTransactions,
cashSales, gcashSales, cardSales, otherSales: gcashSales + cardSales, expenses, net,
cashOnHand:coh, cashFund:cf, expectedCash:expected, difference:diff,
status:diff>0?'over':diff<0?'short':'exact', transactions: filtered, createdAt: endTime, sync_status: 'pending'
};
const shifts=DB.get('shifts',[]);
if(!shifts.find(s=>s.shiftId===shiftData.shiftId)){
DB.set('shifts',[...shifts,shiftData]);
DB.setAsync('shifts',[...shifts,shiftData]).catch(function(e){ console.warn('IDB sync failed:',e); });
}
var adminHistory = DB.get('adminSalesHistory',[]);
if(!adminHistory.find(function(a){ return a.shiftId===shiftData.shiftId; })){
var newHistory = [...adminHistory,shiftData];
DB.set('adminSalesHistory',newHistory);
DB.setAsync('adminSalesHistory',newHistory).catch(function(e){ console.warn('IDB sync failed:',e); });
}
if(!navigator.onLine){ DB.queueOffline('shift', shiftData); }

const activeShifts = DB.get('activeShifts',{});
delete activeShifts[user.id];
DB.set('activeShifts',activeShifts);
setEndedShiftData(shiftData);
setShowPrintReport(true);
DB.createBackup();
showToast('Shift #' + shiftData.shiftNumber + ' ended. ' + (diff>=0?'Over':'Short') + ': ' + fmtCur(Math.abs(diff)),'info');
setShowShiftModal(false);setCashOnHand('');setCashFund('');
forceUpdate();
} catch (e) { showToast('End shift failed','error'); console.error(e); }
},[activeShift,user,cashOnHand,cashFund,cashSales,expenses,totalSales,totalTransactions,net,filtered]);

const printReceipt = useCallback((txn) => { setReprintTxn(txn); setTimeout(() => window.print(), 100); },[]);
const printShiftReport = useCallback(() => { setTimeout(() => window.print(), 100); },[]);

return(
<div style={{padding:'20px',flex:1,overflow:'auto'}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
<div>
<h2 style={{fontSize:20,fontWeight:700}}>Sales History</h2>
{activeShift ? (
<p style={{color:'var(--text3)',fontSize:13}}>Shift #{activeShift.shiftNumber} • Started {fmtTime(activeShift.startTime)} • {totalTransactions} transactions</p>
) : (
<p style={{color:'var(--yellow)',fontSize:13}}>No active shift. Please login again to start a new shift.</p>
)}
</div>
<div style={{display:'flex',gap:10,alignItems:'center'}}>
<input type="date" value={dateFilter} onChange={e=>setDateFilter(e.target.value)} style={{width:160}}/>
<button className="btn btn-ghost btn-sm" onClick={()=>setShowShiftModal(true)} disabled={!activeShift}>
{Icon.shift} End Shift
</button>
</div>
</div>
<div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12,marginBottom:20}}>
<div className="stat-card"><div className="stat-val" style={{color:'var(--accent)'}}>{fmtCur(totalSales)}</div><div className="stat-label">Total Sales</div></div>
<div className="stat-card"><div className="stat-val" style={{color:'var(--green)'}}>{fmtCur(cashSales)}</div><div className="stat-label">Cash Sales</div></div>
<div className="stat-card"><div className="stat-val" style={{color:'var(--accent2)'}}>{fmtCur(gcashSales)}</div><div className="stat-label">GCash</div></div>
<div className="stat-card"><div className="stat-val" style={{color:'var(--purple)'}}>{fmtCur(cardSales)}</div><div className="stat-label">Card</div></div>
<div className="stat-card"><div className="stat-val">{totalTransactions}</div><div className="stat-label">Transactions</div></div>
</div>
<div className="card" style={{padding:0,overflow:'hidden'}}>
<table>
<thead><tr><th>TXN #</th><th>Time</th><th>Customer</th><th>Items</th><th>Discount</th><th>Total</th><th>Payment</th><th>Cashier</th><th></th></tr></thead>
<tbody>
{filtered.map(t=>(
<tr key={t.id}>
<td style={{fontFamily:'var(--mono)',fontSize:12}}>{t.id}</td>
<td style={{fontSize:12}}>{fmtTime(t.createdAt)}</td>
<td>{t.customerName}</td>
<td style={{fontSize:12}}>{t.items.length} item(s)</td>
<td style={{fontSize:12,color:'var(--green)'}}>{t.discount>0?'-'+fmtCur(t.discount):'—'}</td>
<td style={{fontFamily:'var(--mono)',fontWeight:600,color:'var(--accent)'}}>{fmtCur(t.total)}</td>
<td><span className={`badge ${t.payMode==='cash'?'badge-green':t.payMode==='gcash'?'badge-blue':'badge-purple'}`}>{t.payMode.toUpperCase()}</span></td>
<td style={{fontSize:12}}>{t.cashierName}</td>
<td>
<div style={{display:'flex',gap:4}}>
<button className="btn btn-ghost btn-sm" style={{padding:'4px 8px',fontSize:11}} onClick={()=>setSelectedTxn(t)}>View</button>
<button className="btn btn-ghost btn-sm" style={{padding:'4px 8px',fontSize:11}} onClick={()=>printReceipt(t)}>{Icon.print}</button>
</div>
</td>
</tr>
))}
{filtered.length===0&&<tr><td colSpan={9} style={{textAlign:'center',padding:'30px',color:'var(--text3)'}}>
{activeShift ? 'No transactions for this shift yet' : 'Start a new shift to begin selling'}
</td></tr>}
</tbody>
</table>
</div>

{showShiftModal&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:420}}>
<h3 style={{marginBottom:16,display:'flex',alignItems:'center',gap:8}}>{Icon.shift} End Shift #{activeShift?.shiftNumber}</h3>
<div style={{background:'var(--bg3)',borderRadius:'var(--radius)',padding:14,marginBottom:16}}>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Date</span><span>{dateFilter}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Start Time</span><span>{activeShift ? fmtTime(activeShift.startTime) : '—'}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Total Sales</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(totalSales)}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Cash Sales</span><span style={{fontFamily:'var(--mono)',color:'var(--green)'}}>{fmtCur(cashSales)}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>GCash Sales</span><span style={{fontFamily:'var(--mono)',color:'var(--accent2)'}}>{fmtCur(gcashSales)}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Card Sales</span><span style={{fontFamily:'var(--mono)',color:'var(--purple)'}}>{fmtCur(cardSales)}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Transactions</span><span>{totalTransactions}</span></div>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Expenses</span><span style={{fontFamily:'var(--mono)',color:'var(--red)'}}>-{fmtCur(expenses)}</span></div>
<div className="divider"/>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}><span style={{color:'var(--text2)'}}>Expected Cash</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(Number(cashSales||0)+Number(cashFund||0)-Number(expenses||0))}</span></div>
</div>
<div style={{marginBottom:12}}>
<label>Cash Fund (Starting Cash)</label>
<input type="number" value={cashFund} onChange={e=>setCashFund(e.target.value)} placeholder="Enter starting cash amount" style={{width:'100%',fontSize:16}}/>
</div>
<div style={{marginBottom:16}}>
<label>Actual Cash on Hand</label>
<input type="number" value={cashOnHand} onChange={e=>setCashOnHand(e.target.value)} placeholder="Enter amount" style={{width:'100%',fontSize:16}}/>
{cashOnHand&&(
<div style={{marginTop:8,padding:'8px 12px',borderRadius:'var(--radius)',background:Number(cashOnHand||0)>=(Number(cashSales||0)+Number(cashFund||0)-Number(expenses||0))?'var(--green-dim)':'var(--red-dim)',color:Number(cashOnHand||0)>=(Number(cashSales||0)+Number(cashFund||0)-Number(expenses||0))?'var(--green)':'var(--red)',fontSize:13,fontWeight:600}}>
{Number(cashOnHand||0)>=(Number(cashSales||0)+Number(cashFund||0)-Number(expenses||0))?'OVER':'SHORT'}: {fmtCur(Math.abs(Number(cashOnHand||0)-(Number(cashSales||0)+Number(cashFund||0)-Number(expenses||0))))}
</div>
)}
</div>
<div style={{display:'flex',gap:10}}>
<button className="btn btn-ghost" style={{flex:1}} onClick={()=>setShowShiftModal(false)}>Cancel</button>
<button className="btn btn-primary" style={{flex:1}} onClick={endShift}>End Shift & Print</button>
</div>
</div>
</div>
)}

{selectedTxn&&(
<div className="modal-overlay">
<div className="modal" style={{maxWidth:420}}>
<div style={{display:'flex',justifyContent:'space-between',marginBottom:16}}>
<h3>Transaction Detail</h3>
<div style={{display:'flex',gap:8}}>
<button className="btn btn-ghost btn-sm" onClick={()=>printReceipt(selectedTxn)}>{Icon.print} Reprint</button>
<button className="btn btn-ghost btn-sm" onClick={()=>setSelectedTxn(null)}>✕</button>
</div>
</div>
<div style={{fontSize:12,color:'var(--text2)',marginBottom:12}}>
<div>{selectedTxn.id} • {fmtDateTime(selectedTxn.createdAt)}</div>
<div>Shift #{selectedTxn.shiftNumber} • Cashier: {selectedTxn.cashierName} • Customer: {selectedTxn.customerName}</div>
</div>
{selectedTxn.items.map((i,x)=>(
<div key={x} style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:6,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
<span>{i.name} {i.weight_kg ? `(${i.weight_kg}kg)` : `× ${i.qty}`}</span><span style={{fontFamily:'var(--mono)'}}>{fmtCur(i.subtotal)}</span>
</div>
))}
<div className="divider"/>
<div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4}}><span style={{color:'var(--text2)'}}>Subtotal</span><span>{fmtCur(selectedTxn.subtotal)}</span></div>
{selectedTxn.discount>0&&<div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4,color:'var(--green)'}}><span>Discount</span><span>-{fmtCur(selectedTxn.discount)}</span></div>}
<div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:15}}><span>Total</span><span style={{fontFamily:'var(--mono)',color:'var(--accent)'}}>{fmtCur(selectedTxn.total)}</span></div>
</div>
</div>
)}

{reprintTxn && (
<div className="modal-overlay">
<div className="modal" style={{maxWidth:380}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
<h3>Reprint Receipt</h3>
<div style={{display:'flex',gap:8}}>
<button className="btn btn-ghost btn-sm" onClick={()=>{setTimeout(()=>window.print(),100);}}>{Icon.print} Print</button>
<button className="btn btn-ghost btn-sm" onClick={()=>setReprintTxn(null)}>Close</button>
</div>
</div>
<div className="receipt receipt-wrapper">
