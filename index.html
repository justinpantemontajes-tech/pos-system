/* ─── MAIN APP ─── */
const App=()=>{
const [user,setUser]=useState(()=>{
try{var u=sessionStorage.getItem('bpos_user');return u?JSON.parse(u):null;}catch(e){return null;}
});
const [sessionId,setSessionId]=useState(()=>sessionStorage.getItem('bpos_sid')||null);
const [page,setPage]=useState('pos');
const [collapsed,setCollapsed]=useState(false);
const {toast,showToast:_}=useToast();

useEffect(function(){
if (navigator.storage && navigator.storage.persist) {
navigator.storage.persist().then(function(granted) {
if (granted) console.log('Persistent storage granted');
else console.warn('Persistent storage denied - data may be cleared by browser');
});
}
},[]);

useEffect(function(){ registerServiceWorker(); },[]);

useEffect(function(){
var init = async function() {
try {
await IDB.init();
var issues = DB.validateData();
if (issues.length > 0) {
console.warn('Data issues found on startup:', issues);
await DB.repairData();
}
await WAL.cleanup(86400000);
} catch (e) {
console.error('System initialization failed:', e);
}
};
init();
},[]);

useEffect(function(){
var backupInterval = setInterval(function(){
if(user) { AutoSave.flush(); DB.createBackup(); WAL.cleanup(); }
}, 300000);
return function() { clearInterval(backupInterval); };
},[user]);

useEffect(()=>{
const issues = DB.validateData();
if(issues.length > 0){
console.warn('Data issues found:', issues);
DB.repairData();
}
},[]);

const login=useCallback(function(u,sid){
setUser(u);setSessionId(sid);
sessionStorage.setItem('bpos_user',JSON.stringify(u));
sessionStorage.setItem('bpos_sid',sid);
setPage(u.role==='admin'?'pos':'pos');
DB.createBackup();
var stores = ['products','categories','transactions','expenses','shifts','adminSalesHistory','users','settings'];
stores.forEach(function(s) {
var data = DB.get(s, null);
if (data !== null) DB.setAsync(s, data);
});
},[]);

const logout=useCallback(()=>{
try {
if(sessionId){
const sessions=DB.get('sessions',[]);
DB.set('sessions',sessions.map(s=>s.id===sessionId?{...s,logoutAt:now()}:s));
}
if(user){
const activeShifts = DB.get('activeShifts',{});
if(activeShifts[user.id]){
delete activeShifts[user.id];
DB.set('activeShifts',activeShifts);
}
}
} catch (e) { console.error('Logout error:', e); }
setUser(null);setSessionId(null);
sessionStorage.clear();
},[sessionId,user]);

useEffect(function(){
var handleBeforeUnload = function() { AutoSave.flush(); DB.createBackup(); };
window.addEventListener('beforeunload', handleBeforeUnload);
var handleVisibility = function() {
if (document.visibilityState === 'hidden') { AutoSave.flush(); DB.createBackup(); }
};
document.addEventListener('visibilitychange', handleVisibility);
return function() {
window.removeEventListener('beforeunload', handleBeforeUnload);
document.removeEventListener('visibilitychange', handleVisibility);
};
},[]);

if(!user)return<><LoginPage onLogin={login}/>{toast&&<Toast msg={toast.msg} type={toast.type}/>}</>;

const pages={
pos:<POSTerminal user={user}/>,
products:<ProductsPage user={user}/>,
inventory:<InventoryPage user={user}/>,
sales:<SalesPage user={user}/>,
expenses:<ExpensesPage user={user}/>,
reports:<ReportsPage/>,
archive:<AdminArchivePage/>,
users:<UsersPage currentUser={user}/>,
settings:<SettingsPage/>,
};

return(
<ErrorBoundary>
<div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
<Sidebar page={page} setPage={setPage} user={user} onLogout={logout} collapsed={collapsed} setCollapsed={setCollapsed}/>
<div style={{flex:1,overflow:'auto',display:'flex',flexDirection:'column'}}>
<div style={{padding:'10px 20px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
<div style={{fontSize:14,fontWeight:600,textTransform:'capitalize'}}>{page==='pos'?'POS Terminal':page==='archive'?'Admin Archive':page}</div>
<div style={{display:'flex',alignItems:'center',gap:14,fontSize:12,color:'var(--text2)'}}>
<span>{new Date().toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</span>
<span style={{display:'flex',alignItems:'center',gap:5}}>
<span style={{width:7,height:7,borderRadius:'50%',background:'var(--green)',display:'inline-block'}}/>
